      const toggleLogPrivacy = (logId) => {
        setMyLogs(prev => prev.map(log => {
          if (log.id === logId) {
            const nextPrivacy = log.privacy === "PUBLIC" ? "PRIVATE" : "PUBLIC";
            const label = nextPrivacy === "PUBLIC" ? "🌐 全員に公開" : "👁️ 自分のみ(非公開)";
            showToast(`公開範囲を変更しました：${label}`);
            return { ...log, privacy: nextPrivacy };

        }));
      };

      const isMine = (name) => typeof name === "string" && name.includes("あなた");
      const myStats = useMemo(() => calcMyStats(posts), [posts]);
      const authorStats = (name) => isMine(name) ? myStats : sampleAuthorStats(name);

      const handleThanks = (e, postId) => {

        const target = posts.find(p => p.id === postId);
        if (!target) return;

        const newIsLiked = !target.isLiked;
        const isQ = target.type === "question";
        const earns = !isQ && !isMine(target.author);   // ポイントが動くのは、他の人の情報投稿への「助かった！」だけ

        if (newIsLiked) {
          const rect = e.currentTarget.getBoundingClientRect();
          const heartId = Date.now();
          setFloatingHearts(prev => [
            ...prev,
            { id: heartId, x: rect.left + rect.width / 2, y: rect.top - 10, label: isQ ? "気になる" : earns ? `+${POINT_RULES.thanks}pt` : "助かった！", icon: isQ ? "notifications" : "favorite" }
          ]);
          setTimeout(() => {
            setFloatingHearts(prev => prev.filter(h => h.id !== heartId));
          }, 900);
        }
        setPosts(prevPosts =>
          prevPosts.map(p => p.id === postId ? { ...p, isLiked: newIsLiked, thanks: p.thanks + (newIsLiked ? 1 : -1) } : p)
        );
        if (target.type === "question") {

        if (newIsLiked) {

      const handleCommentThanks = (postId, commentId) => {

        setUserThanks(t => Math.max(0, t + (cmt.isLiked ? -POINT_RULES.thanks : POINT_RULES.thanks)));
        setPosts(prevPosts =>

        setNewTags([]);
        setJoinTarget(null);
        setJoinNote("");
        setOpenNewPostModal(false);
        setCurrentTab(0);
        setSearchQuery("");
        setSelectedTag("");
        setOnlyQuestions(false);
        if (isQ) {
          showToast("🙋 質問を投稿しました！回答が付くとここに表示されます");
        } else {
          setUserThanks(t => t + POINT_RULES.share);
          showToast(`🎉 記事を投稿しました（+${POINT_RULES.share}pt）`);
        }
      };

      // 🔗 似ている質問と「一緒に回答を待つ」：新しく投稿せず、その質問に合流する（自分の意思で選ぶ）
      const joinQuestion = (postId) => {
        const target = postsRef.current.find(p => p.id === postId);
        if (!target) return;
        const me = { id: `j-${Date.now()}`, who: newAnonymous ? "匿名の学生（あなた）" : myLabel, note: joinNote.trim(), at: Date.now(), mine: true };
        setPosts(prev => prev.map(p => p.id === postId
          ? { ...p, isLiked: true, thanks: p.isLiked ? p.thanks : p.thanks + 1, joiners: [...(p.joiners || []), me] }
          : p));
        // 回答が届いたらお知らせ（「気になる」と同じしくみ）。デモでは少し後に回答が届く
        clearTimeout(watchTimers.current[postId]);
        if (!target.bestAnswerId && target.commentsCount < SUMMARY_MIN_ANSWERS) {
          watchTimers.current[postId] = setTimeout(() => deliverWatchedAnswer(postId), WATCH_DEMO_DELAY_MS);
        }
        setNewTitle("");
        setNewContent("");
        setNewImage(null);
        setNewTags([]);
        setJoinTarget(null);
        setJoinNote("");
        setOpenNewPostModal(false);
        setSelectedPostId(postId);
        showToast("🙌 この質問と一緒に回答を待っています。回答が届いたらお知らせします");
      };

      // 🚩 通報
      const openReport = (postId, commentId) => {
        setReportReason("");
        setReportTarget({ postId, commentId: commentId || null });
      };

      const submitReport = () => {
        if (!reportTarget || !reportReason) return;
        const key = reportTarget.commentId
          ? `c:${reportTarget.postId}:${reportTarget.commentId}`
          : `p:${reportTarget.postId}`;
        setReportedIds(prev => prev.includes(key) ? prev : [...prev, key]);
        if (!reportTarget.commentId) setSelectedPostId(null);
        setReportTarget(null);
        setReportReason("");
        showToast("🚩 通報を受け付けました。この内容は非表示にしました（デモのため運営への送信は行われません）");
      };

      const handleResetDemo = () => {
        if (!window.confirm("この端末に保存されている投稿・質問・回答・ポイント・認証をすべて初期状態に戻します。よろしいですか？")) return;
        clearAllPersisted();
        window.location.reload();
      };

      // 🔍 検索：言い換え（同義語）にも対応。スペース区切りは「すべて含む」。並べ替え・絞り込みもここで行う
      const searchTokens = useMemo(() => parseQuery(searchQuery), [searchQuery]);
      const filteredPosts = useMemo(() => {
        const filtered = posts.filter(post => {
          if (reportedIds.includes(`p:${post.id}`)) return false;

          const hay = norm(`${post.title} ${post.content} ${post.category} ${extractTags(post).join(" ")}`);
          const matchesQuery = searchTokens.every(t => expandToken(t).some(w => hay.includes(w)));

          const matchesTag = selectedTag === "" || post.category === selectedTag;
          const matchesType = (!onlyQuestions || post.type === "question") && (!onlyInfo || post.type !== "question") && (!onlyMyFaculty || facultyOf(post) === U.faculty);
          const matchesAnswer = answerFilter === "all"
            || (answerFilter === "none" && post.type === "question" && post.commentsCount === 0)
            || (answerFilter === "has" && post.commentsCount > 0);
          const matchesAttr = (!fImage || !!post.image) && (!fPopular || post.thanks >= 40) && (!fRecent || minutesAgo(post) <= 10080);

          return matchesQuery && matchesTag && matchesType && matchesAnswer && matchesAttr;
        });
        const indexed = filtered.map((p, i) => ({ p, i }));
        if (sortKey === "new") indexed.sort((x, y) => minutesAgo(x.p) - minutesAgo(y.p) || x.i - y.i);
        else if (sortKey === "popular") indexed.sort((x, y) => (y.p.thanks - x.p.thanks) || x.i - y.i);
        else if (sortKey === "answers") indexed.sort((x, y) => (y.p.commentsCount - x.p.commentsCount) || x.i - y.i);
        else if (searchTokens.length > 0) {
          // おすすめ：タイトルに入っている・助かった数が多い順
          const score = (p) => {
            const title = norm(p.title);
            const hits = searchTokens.reduce((n, t) => n + (expandToken(t).some(w => title.includes(w)) ? 3 : 1), 0);
            return hits + Math.log(p.thanks + 1) * 0.3;
          };
          indexed.sort((x, y) => score(y.p) - score(x.p) || x.i - y.i);
        }
        return indexed.map(x => x.p);
      }, [posts, searchTokens, selectedTag, onlyQuestions, onlyMyFaculty, onlyInfo, answerFilter, fImage, fPopular, fRecent, sortKey, reportedIds]);

      // 関連キーワード（結果に多く出てくるハッシュタグ＋言い換え）
      const relatedKeywords = useMemo(() => {
        const used = new Set(searchTokens.flatMap(expandToken));
        const counts = {};
        filteredPosts.forEach(p => extractTags(p).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
        const tagList = Object.keys(counts).sort((x, y) => counts[y] - counts[x]).filter(t => !used.has(norm(t))).map(t => ({ label: `#${t}`, q: `#${t}` }));
        const synList = searchTokens.flatMap(t => {
          const n = norm(t);
          const g = SYNONYM_GROUPS.find(gr => gr.some(m => norm(m) === n));
          return g ? g.filter(m => norm(m) !== n).map(m => ({ label: m, q: m })) : [];
        });
        return [...tagList, ...synList].slice(0, 8);
      }, [filteredPosts, searchTokens]);

      // 人気のハッシュタグ（全投稿から集計）
      const popularTags = useMemo(() => {
        const counts = {};
        posts.forEach(p => extractTags(p).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
        return Object.keys(counts).sort((x, y) => counts[y] - counts[x]).slice(0, 8);
      }, [posts]);

      // 入力中の候補（検索履歴／キーワード／投稿）
      const suggestions = useMemo(() => {
        const q = searchQuery.trim();
        if (!q) return null;
        const last = norm((q.match(/(\S*)$/) || ["", ""])[1].replace(/^[#＃]/, ""));
        const hist = searchHistory.filter(h => h !== q && norm(h).includes(norm(q))).slice(0, 3);
        const kw = last ? KEYWORD_POOL.filter(k => norm(k).includes(last) && norm(k) !== last)
          .sort((x, y) => (norm(y).startsWith(last) ? 1 : 0) - (norm(x).startsWith(last) ? 1 : 0)).slice(0, 5) : [];
        const titles = last ? posts.filter(p => !reportedIds.includes(`p:${p.id}`) && norm(p.title).includes(last)).slice(0, 3) : [];
        return { hist, kw, titles };
      }, [searchQuery, searchHistory, posts, reportedIds]);

      const addHistory = (q) => {
        const t = (q || "").trim();
        if (!t) return;
        setSearchHistory(prev => [t, ...prev.filter(x => x !== t)].slice(0, 8));
      };
      // 検索を確定（履歴に残し、候補を閉じる）
      const runSearch = (q) => {
        setSearchQuery(q);
        addHistory(q);
        setIsSearchFocused(false);
        setSelectedPost(null);
      };
      const resetResultFilters = () => {
        setOnlyInfo(false); setAnswerFilter("all"); setFImage(false); setFPopular(false); setFRecent(false); setSortKey("recommended");
      };
      const activeFilterList = [
        onlyQuestions && { key: "q", label: "質問", clear: () => setOnlyQuestions(false) },
        onlyMyFaculty && { key: "fac", label: `${U.faculty}の投稿`, clear: () => setOnlyMyFaculty(false) },
        onlyInfo && { key: "i", label: "記事", clear: () => setOnlyInfo(false) },
        answerFilter === "none" && { key: "n", label: "回答なし", clear: () => setAnswerFilter("all") },
        answerFilter === "has" && { key: "h", label: "回答あり", clear: () => setAnswerFilter("all") },
        fImage && { key: "p", label: "写真あり", clear: () => setFImage(false) },
        fPopular && { key: "f", label: "高評価", clear: () => setFPopular(false) },
        fRecent && { key: "r", label: "1週間以内", clear: () => setFRecent(false) }
      ].filter(Boolean);
      const activeFilterCount = activeFilterList.length;

      const activeDirectAnswer = useMemo(() => {
        if (onlyQuestions) return null;
        if (selectedTag) {
          const match = Object.values(DIRECT_ANSWERS).find(a => a.tag === selectedTag);
          if (match) return match;
        }
        if (searchQuery) {
          const key = Object.keys(DIRECT_ANSWERS).find(k => searchQuery.includes(k));
          if (key) return DIRECT_ANSWERS[key];
        }
        return null;
      }, [searchQuery, selectedTag, onlyQuestions]);

      // 🔐 入口画面：未認証のあいだは入口だけを表示（すべてのフック呼び出しより後ろに置くこと）
      if (!verified) {
        return <GateScreen U={U} onEnter={() => setVerified(true)} />;
      }

      const allWaitingQuestions = posts
        .filter(p => p.type === "question" && !p.bestAnswerId && !reportedIds.includes(`p:${p.id}`))
        .sort((a, b) => ((a.commentsCount === 0 ? 0 : 1) - (b.commentsCount === 0 ? 0 : 1))
          || ((b.joiners || []).length - (a.joiners || []).length)   // 同じ疑問の人が多い質問ほど上に
          || (ageMinutes(a) - ageMinutes(b)));
      const waitingQuestions = allWaitingQuestions.slice(0, 6);
      // 🔗 質問を書いている途中に、似ている質問を探す
      const similarQs = (openNewPostModal && newType === "question")
        ? findSimilarQuestions(posts, newTitle, newCategory, p => reportedIds.includes(`p:${p.id}`))
        : [];

      const isQuestion = !!selectedPost && selectedPost.type === "question";
      const sortedComments = selectedPost
        ? [...selectedPost.comments].sort((a, b) => ((b.id === selectedPost.bestAnswerId) - (a.id === selectedPost.bestAnswerId)) || ((b.thanks || 0) - (a.thanks || 0)))
        : [];
      const showInstallBanner = false;   // WS版：テキストを減らすため非表示
      const hasStudentAnswers = !!selectedPost && selectedPost.comments.length > 0;
      const visibleComments = showAllAnswers ? sortedComments : sortedComments.slice(0, 10);

      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink flex flex-col relative pb-32 overflow-x-hidden bg-blobs">

          <header className="sticky top-0 z-30 bg-bg/95 px-4 pb-2.5 w-full" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
            <div className="flex justify-between items-center gap-2">
              <div className="flex items-center gap-2 min-w-0">
                <img src={LOGO_MARK} alt="" className="w-8 h-8 flex-shrink-0" />
                <div className="min-w-0">
                  <h1 className="font-head font-black text-[13px] leading-tight whitespace-nowrap">キャンパスリアルポータル</h1>
                  <span className="text-[12px] text-sub flex items-center gap-1 truncate">
                    <Icon n="verified" fill size={13} className="text-brand-deep" />{U.short}生限定コミュニティ
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5 flex-shrink-0">
                <button
                  onClick={() => setCurrentTab(4)}
                  className="bg-surface border border-line/70 text-ink rounded-full pl-2.5 pr-3 py-2 flex items-center gap-1 font-black text-[13px] press"
                >
                  <Icon n="stars" fill size={18} className="text-brand" />
                  <span>{userThanks} pt</span>
                </button>
                <button
                  onClick={openMenuPage}
                  aria-label="メニュー"
                  className="w-10 h-10 rounded-full bg-surface border border-line/70 shadow-soft flex items-center justify-center press"
                >
                  <Icon n="menu" size={22} className="text-ink" />
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 px-4 pt-2 space-y-4 w-full max-w-full overflow-x-hidden">

            {/* TAB 0: フィード */}
            {currentTab === 0 && (
              <div className="space-y-4 w-full">

                {/* 📲 ホーム画面追加の案内（開く手間を減らす） */}
                {showInstallBanner && (
                  <div className="bg-surface border border-line/70 rounded-2xl pl-3.5 pr-1.5 py-1.5 flex gap-2 items-center w-full animate-fade-up">
                    <Icon n="add_to_home_screen" size={20} className="text-brand-deep" />
                    <p className="flex-1 min-w-0 text-[13px] font-bold">ホーム画面に追加して1タップで開く</p>
                    <button onClick={() => setBannerDismissed(true)} aria-label="閉じる" className="text-sub w-8 h-8 flex items-center justify-center flex-shrink-0 press">
                      <Icon n="close" size={18} />
                    </button>
                  </div>
                )}

                {/* 🔍 検索 */}
                <div className="space-y-3 w-full relative">
                  <div className="relative w-full">
                    <Icon n="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2 text-mute" />
                    <input
                      type="text"
                      placeholder="授業名・場所・キーワードで探す"
                      value={searchQuery}
                      enterKeyHint="search"
                      onFocus={() => setIsSearchFocused(true)}
                      onChange={(e) => { setSearchQuery(e.target.value); setIsSearchFocused(true); }}
                      onKeyDown={(e) => { if (e.key === "Enter" && !e.nativeEvent.isComposing) { addHistory(searchQuery); setIsSearchFocused(false); e.currentTarget.blur(); } }}
                      className="w-full bg-surface text-ink placeholder:text-mute rounded-full pl-12 pr-12 py-3.5 text-[14px] outline-none shadow-soft border border-line/70 focus:border-brand transition-colors"
                    />
                    {searchQuery && (
                      <button
                        onClick={() => setSearchQuery("")}
                        aria-label="入力を消す"
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-sunk text-sub flex items-center justify-center press"
                      >
                        <Icon n="close" size={16} />
                      </button>
                    )}
                  </div>

                  {/* 🔎 入力中の候補／（空のとき）検索履歴・トレンド・ハッシュタグ */}
                  {isSearchFocused && !searchQuery && (
                    <div className="bg-surface border border-line/70 rounded-3xl p-3.5 space-y-3.5 shadow-lift animate-fade-up">
                      {searchHistory.length > 0 && (
                        <div className="space-y-1.5">
                          <div className="flex justify-between items-center text-[12px] text-sub font-bold">
                            <span className="flex items-center gap-1"><Icon n="history" size={16} />最近の検索</span>
                            <button onClick={() => setSearchHistory([])} className="text-mute font-bold">すべて削除</button>
                          </div>
                          <div className="flex flex-wrap gap-2">
                            {searchHistory.map(h => (
                              <span key={h} className="bg-sunk text-ink rounded-full text-[13px] font-bold flex items-center">
                                <button onClick={() => runSearch(h)} className="pl-3 pr-1 py-1.5 press">{h}</button>
                                <button onClick={() => setSearchHistory(prev => prev.filter(x => x !== h))} aria-label={`「${h}」を履歴から消す`} className="pr-2 pl-0.5 py-1.5 text-mute press"><Icon n="close" size={14} /></button>
                              </span>
                            ))}
                          </div>
                        </div>
                      )}
                      <div className="space-y-1.5">
                        <div className="flex justify-between items-center text-[12px] text-sub font-bold">
                          <span className="flex items-center gap-1"><Icon n="local_fire_department" fill size={16} className="text-brand" />トレンド</span>
                          <button onClick={() => setIsSearchFocused(false)} className="text-mute font-bold">閉じる</button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {TRENDING_KEYWORDS.map((kw, i) => (
                            <button
                              key={i}
                              onClick={() => runSearch(kw)}
                              className="bg-sunk text-ink px-3 py-1.5 rounded-full text-[13px] font-bold press flex items-center gap-1"
                            >
                              <Icon n="trending_up" size={16} className="text-brand-deep" />
                              <span>{kw}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                      {popularTags.length > 0 && (
                        <div className="space-y-1.5">
                          <div className="text-[12px] text-sub font-bold flex items-center gap-1"><Icon n="tag" size={16} />人気のハッシュタグ</div>
                          <div className="flex flex-wrap gap-x-3 gap-y-1">
                            {popularTags.map(t => (
                              <button key={t} onClick={() => runSearch(`#${t}`)} className="text-[14px] font-bold text-brand-deep press">#{t}</button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                  {isSearchFocused && searchQuery && suggestions && (
                    <div className="bg-surface border border-line/70 rounded-3xl p-2 shadow-lift animate-fade-up" role="listbox" aria-label="検索の候補">
                      <button
                        onClick={() => runSearch(searchQuery.trim())}
                        className="w-full text-left px-3 py-2.5 rounded-2xl flex items-center gap-2.5 bg-brand-tint text-brand-deep font-black text-[13px] press"
                      >
                        <Icon n="search" size={18} />
                        <span className="min-w-0 truncate">「{searchQuery.trim()}」で検索</span>
                        <span className="ml-auto flex-shrink-0 text-[12px]">{filteredPosts.length}件</span>
                      </button>
                      {suggestions.hist.map(h => (
                        <button key={`h${h}`} onClick={() => runSearch(h)} className="w-full text-left px-3 py-2.5 rounded-2xl flex items-center gap-2.5 text-[13px] text-ink press">
                          <Icon n="history" size={18} className="text-mute" /><span className="truncate">{h}</span>
                        </button>
                      ))}
                      {suggestions.kw.map(k => (
                        <button key={`k${k}`} onClick={() => runSearch(searchQuery.replace(/(\S*)$/, k))} className="w-full text-left px-3 py-2.5 rounded-2xl flex items-center gap-2.5 text-[13px] text-ink press">
                          <Icon n="search" size={18} className="text-mute" /><span className="truncate font-bold">{k}</span>
                        </button>
                      ))}
                      {suggestions.titles.map(p => (
                        <button key={`t${p.id}`} onClick={() => { addHistory(searchQuery); setIsSearchFocused(false); setSelectedPost(p); }} className="w-full text-left px-3 py-2.5 rounded-2xl flex items-center gap-2.5 text-[13px] text-ink press">
                          <Icon n={p.type === "question" ? "help" : "article"} size={18} className="text-mute" /><span className="line-clamp-1 flex-1">{p.title}</span>
                        </button>
                      ))}
                      <button onClick={() => setIsSearchFocused(false)} className="w-full text-center py-1.5 text-[12px] text-mute font-bold">候補を閉じる</button>
                    </div>
                  )}

                  {/* クイック検索タグ（質問／カテゴリ） */}
                  <ScrollRow className="flex gap-3 overflow-x-auto pb-1 scrollbar-none w-full -mx-0.5 px-0.5">
                    {[
                      { key: "q", label: "質問", icon: "help", active: onlyQuestions, on: () => { setOnlyInfo(false); setOnlyQuestions(!onlyQuestions); } },
                      ...CATEGORIES.map(c => ({ key: c, label: catMeta(c).short, icon: catMeta(c).icon, active: selectedTag === c, on: () => setSelectedTag(selectedTag === c ? "" : c) })),
                      { key: "rakutan", label: "楽単", icon: "thumb_up", active: searchQuery === "楽単", on: () => setSearchQuery(searchQuery === "楽単" ? "" : "楽単") }
                    ].map(s => (
                      <button key={s.key} onClick={s.on} aria-pressed={s.active} className="flex flex-col items-center gap-1 w-[60px] flex-shrink-0 press">
                        <span className="w-[56px] h-[56px] rounded-full p-[2.5px]" style={{ background: s.active ? "rgb(var(--brand))" : "conic-gradient(rgb(var(--brand)), rgb(var(--brand) / .35), rgb(var(--brand)))" }}>
                          <span className={cx("w-full h-full rounded-full flex items-center justify-center border-2 border-bg", s.active ? "bg-brand text-on-brand" : "bg-surface text-brand-deep")}>
                            <Icon n={s.active ? "check" : s.icon} fill size={24} />
                          </span>
                        </span>
                        <span className={cx("text-[11px] whitespace-nowrap", s.active ? "font-black text-brand-deep" : "font-bold text-sub")}>{s.label}</span>
                      </button>
                    ))}
                  </ScrollRow>
                </div>

                {/* 🎯 検索結果 */}
                {isSearching ? (
                  <div className="space-y-4">
                    <div className="space-y-2.5">
                      <div className="flex justify-between items-center px-1">
                        <span className="font-head font-black text-[16px] text-brand-deep flex items-center gap-1.5">
                          <Icon n="manage_search" size={22} />
                          <span>検索結果 ({filteredPosts.length}件)</span>
                        </span>
                        <button
                          onClick={() => { setSearchQuery(""); setSelectedTag(""); setOnlyQuestions(false); setOnlyMyFaculty(false); resetResultFilters(); }}
                          className="text-sub text-[12px] underline"
                        >
                          検索をクリア
                        </button>
                      </div>

                      <ScrollRow className="flex items-center gap-2 overflow-x-auto scrollbar-none">
                        <button
                          onClick={() => setSearchSheet("sort")}
                          aria-label="並べ替え"
                          className="flex-shrink-0 px-3 py-1.5 rounded-full text-[12px] font-black bg-ink text-bg flex items-center gap-1 press"
                        >
                          <Icon n="swap_vert" size={16} />{(SORT_OPTIONS.find(o => o.v === sortKey) || SORT_OPTIONS[0]).label}<Icon n="expand_more" size={16} />
                        </button>
                        <button
                          onClick={() => setSearchSheet("filter")}
                          aria-label="絞り込み"
                          className={cx(
                            "flex-shrink-0 px-3 py-1.5 rounded-full text-[12px] font-black flex items-center gap-1 press border-[1.5px]",
                            activeFilterCount > 0 ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line"
                          )}
                        >
                          <Icon n="tune" size={16} />絞り込み
                          {activeFilterCount > 0 && <span className="bg-surface text-brand-deep rounded-full text-[12px] min-w-[18px] h-[18px] px-1 flex items-center justify-center">{activeFilterCount}</span>}
                        </button>
                        {activeFilterList.map(f => (
                          <button key={f.key} onClick={f.clear} aria-label={`${f.label}を外す`} className="flex-shrink-0 bg-brand-tint text-brand-deep rounded-full pl-2.5 pr-1.5 py-1.5 text-[12px] font-bold flex items-center gap-0.5 press">
                            {f.label}<Icon n="close" size={14} />
                          </button>
                        ))}
                        {relatedKeywords.length > 0 && <span className="flex-shrink-0 text-[12px] font-bold text-mute pl-1 border-l border-line">関連</span>}
                        {relatedKeywords.map(k => (
                          <button key={k.q} onClick={() => runSearch(k.q)} className="flex-shrink-0 text-[13px] font-bold text-brand-deep press whitespace-nowrap px-0.5">{k.label}</button>
                        ))}
                      </ScrollRow>
                    </div>

                    {/* ⚡ 1秒結論カード（AIダイレクトアンサー） */}

            <Sheet onClose={() => setSearchSheet(null)}>
              <SheetHeader title="並べ替え" icon="swap_vert" onClose={() => setSearchSheet(null)} />
              <div className="px-5 pb-6 pt-1 space-y-1.5">
                {SORT_OPTIONS.map(o => (
                  <button
                    key={o.v}
                    onClick={() => { setSortKey(o.v); setSearchSheet(null); }}
                    aria-pressed={sortKey === o.v}
                    className={cx("w-full text-left rounded-2xl px-4 py-3.5 flex items-center gap-3 press", sortKey === o.v ? "bg-brand-tint text-brand-deep font-black" : "bg-sunk text-ink font-bold")}
                  >
                    <Icon n={o.icon} fill size={20} />
                    <span className="flex-1 text-[14px]">{o.label}</span>
                    {sortKey === o.v && <Icon n="check" size={20} />}
                  </button>
                ))}
              </div>
            </Sheet>
          )}

          {searchSheet === "filter" && (
            <Sheet onClose={() => setSearchSheet(null)}>
              <SheetHeader title="絞り込み" icon="tune" onClose={() => setSearchSheet(null)} />
              <div className="px-5 pb-3 pt-1 space-y-4 overflow-y-auto">
                {[
                  { title: "種類", items: [
                    { key: "q", label: "質問", on: onlyQuestions, toggle: () => { setOnlyInfo(false); setOnlyQuestions(!onlyQuestions); } },
                    { key: "i", label: "記事", on: onlyInfo, toggle: () => { setOnlyQuestions(false); setOnlyInfo(!onlyInfo); } }
                  ] },
                  { title: "回答", items: [
                    { key: "n", label: "回答なし", on: answerFilter === "none", toggle: () => setAnswerFilter(answerFilter === "none" ? "all" : "none") },
                    { key: "h", label: "回答あり", on: answerFilter === "has", toggle: () => setAnswerFilter(answerFilter === "has" ? "all" : "has") }
                  ] },
                  { title: "条件", items: [
                    { key: "p", label: "写真あり", on: fImage, toggle: () => setFImage(!fImage) },
                    { key: "f", label: "高評価", on: fPopular, toggle: () => setFPopular(!fPopular) },
                    { key: "r", label: "1週間以内", on: fRecent, toggle: () => setFRecent(!fRecent) }
                  ] }
                ].map(g => (
                  <div key={g.title}>
                    <p className="text-[12px] font-bold text-sub mb-1.5">{g.title}</p>
                    <div className="flex flex-wrap gap-2">
                      {g.items.map(f => (
                        <button
                          key={f.key}
                          onClick={f.toggle}
                          aria-pressed={f.on}
                          className={cx("px-4 py-2 rounded-full text-[13px] font-bold press border-[1.5px]", f.on ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line")}
                        >
                          {f.label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              <div className="px-5 pb-6 pt-3 flex gap-2.5 border-t border-line/70">
                <button onClick={() => { resetResultFilters(); setOnlyQuestions(false); }} className={cx(BTN_SOFT, "px-5")}>リセット</button>
                <button onClick={() => setSearchSheet(null)} className={cx(BTN_PRIMARY, "flex-1")}>結果を見る（{filteredPosts.length}件）</button>
              </div>
            </Sheet>
          )}



          {/* 🏬 協力店の詳細（必要な情報だけ：写真・特典・アクセス・営業時間） */}
          {selectedStore && (
            <Sheet onClose={() => setSelectedStore(null)} z={60}>
              <div className="overflow-y-auto">
                <div className="relative mx-5 rounded-3xl overflow-hidden aspect-[16/9]">
                  <StoreThumb store={selectedStore} className="absolute inset-0 w-full h-full" iconSize={48} />
                  <button onClick={() => setSelectedStore(null)} aria-label="閉じる" className="absolute top-2.5 right-2.5 w-9 h-9 rounded-full bg-surface/90 text-ink flex items-center justify-center shadow-soft press">
                    <Icon n="close" size={20} />
                  </button>
                </div>
                <div className="px-5 pt-4 pb-5 space-y-4">
                  <div className="space-y-1">
                    <div className="flex items-center gap-2 text-[12px] text-sub">
                      <span>{selectedStore.genre}</span><OpenBadge store={selectedStore} />
                    </div>
                    <h3 className="font-head font-black text-[20px] leading-tight">{selectedStore.name}</h3>
                    <p className="text-[13px] text-sub">{selectedStore.note}</p>
                  </div>

                  <div className="bg-brand-tint rounded-2xl p-3.5 flex items-center justify-between gap-3">
                    <div className="min-w-0">
                      <p className="font-head font-black text-[17px] text-brand-deep leading-snug">{selectedStore.ticket.title}</p>
                      <p className="text-[12px] text-sub">{selectedStore.ticket.detail}</p>
                    </div>
                    <span className="font-head font-black text-[15px] text-brand-deep flex-shrink-0">{selectedStore.ticket.cost}pt</span>
                  </div>

                  <div className="space-y-2.5 text-[13px]">
                    <a href={mapUrl(selectedStore)} target="_blank" rel="noopener" className="flex items-start gap-2.5 press">
                      <Icon n="location_on" size={20} className="text-mute mt-px" />
                      <span className="flex-1 min-w-0">
                        <span className="block">{selectedStore.address}</span>
                        <span className="block text-[12px] text-sub">札幌駅 {selectedStore.access}</span>
                      </span>
                      <span className="text-[12px] font-bold text-brand-deep flex items-center flex-shrink-0">地図<Icon n="chevron_right" size={16} /></span>
                    </a>
                    <div className="flex items-start gap-2.5">
                      <Icon n="schedule" size={20} className="text-mute mt-px" />
                      <span className="flex-1">
                        <span className="block">{selectedStore.hoursText}</span>
                        <span className="block text-[12px] text-sub">定休日：{selectedStore.closedText}</span>
                      </span>
                    </div>
                  </div>

                  <p className="text-[11px] text-mute">交換から{TICKET_VALID_DAYS}日間有効・1回1枚・他の割引と併用不可</p>

                  {userThanks >= selectedStore.ticket.cost ? (
                    <button
                      onClick={() => handleExchangePoint({ storeId: selectedStore.id, title: `${selectedStore.name}｜${selectedStore.ticket.title}`, cost: selectedStore.ticket.cost })}
                      className={cx(BTN_PRIMARY, "w-full")}
                    >
                      {selectedStore.ticket.cost}ptで交換する
                    </button>
                  ) : (
                    <div className="w-full py-3.5 rounded-2xl bg-sunk text-mute font-bold text-[14px] text-center">あと{selectedStore.ticket.cost - userThanks}pt で交換できます</div>
                  )}
                </div>
              </div>
            </Sheet>
          )}

          {/* 🎁 交換の確認（仮：楽天ポイント） */}
          {selectedPlan && (
            <Sheet onClose={() => setSelectedPlan(null)} z={60}>
              <SheetHeader title="ポイント交換" icon="redeem" onClose={() => setSelectedPlan(null)} />
              <div className="px-5 pb-6 pt-1 space-y-4">
                <div className="bg-brand-tint rounded-3xl p-5 text-center space-y-1">
                  <p className="text-[12px] font-bold text-brand-deep">{EXCHANGE_NAME}</p>
                  <p className="font-head font-black text-[34px] leading-none text-brand-deep tabular-nums">{selectedPlan.amount}<span className="text-[15px] ml-1">ポイント</span></p>
                </div>
                <div className="space-y-2 text-[13px]">
                  <div className="flex justify-between"><span className="text-sub">使うポイント</span><b className="tabular-nums">{selectedPlan.cost}pt</b></div>
                  <div className="flex justify-between"><span className="text-sub">交換後の残り</span><b className="tabular-nums">{Math.max(0, userThanks - selectedPlan.cost)}pt</b></div>
                  <div className="flex justify-between"><span className="text-sub">受け取り先</span><b>楽天会員（デモ：連携済み）</b></div>
                </div>
                <p className="text-[11px] text-mute">※ デモのため、実際には付与されません</p>
                {userThanks >= selectedPlan.cost ? (
                  <button onClick={() => handleExchangePlan(selectedPlan)} className={cx(BTN_PRIMARY, "w-full")}>{selectedPlan.cost}ptで交換する</button>
                ) : (
                  <div className="w-full py-3.5 rounded-2xl bg-sunk text-mute font-bold text-[14px] text-center">あと{selectedPlan.cost - userThanks}pt で交換できます</div>
                )}
              </div>
            </Sheet>
          )}

          {/* ≡ メニュー */}
          {openMenu && (
            <MenuPage
              me={{ label: myLabel, faculty: U.faculty, grade: userGrade, univ: U.name, website: U.website, sns: U.sns }}
              plan={plan}
              notifPrefs={notifPrefs}
              setNotifPrefs={setNotifPrefs}
              showToast={showToast}
              onClose={closeMenu}
              onPremium={() => { setOpenMenu(false); try { if (window.history.state && window.history.state.tngPage === "menu") window.history.replaceState(null, ""); } catch (e) {} setCurrentTab(3); }}
              onLogout={() => setConfirmLogout(true)}
            />
          )}
          {confirmLogout && (
            <Dialog onClose={() => setConfirmLogout(false)} z={60}>
              <div className="p-5 space-y-4 text-center">
                <Icon n="logout" size={34} className="text-danger" />
                <h3 className="font-head font-black text-[17px]">ログアウトしますか？</h3>
                <p className="text-[13px] text-sub">投稿やポイントは消えません。次回は大学のメールアドレスで入り直します。</p>
                <div className="flex gap-2">
                  <button onClick={() => setConfirmLogout(false)} className={cx(BTN_SOFT, "flex-1")}>やめる</button>
                  <button onClick={() => { setConfirmLogout(false); setOpenMenu(false); setVerified(false); setCurrentTab(0); }} className="flex-1 bg-danger text-white font-black rounded-2xl py-3 text-[14px] press">ログアウト</button>
                </div>
              </div>
            </Dialog>
          )}

          {/* 📋 回答を待っている質問の一覧（全画面ページ。端末の「戻る」でも閉じる） */}
          {openWaitingList && (
            <WaitingPage
              questions={allWaitingQuestions}
              unreadLabelByPost={unreadLabelByPost}
              onOpen={(p) => setSelectedPost(p)}
              onBack={closeWaitingList}
            />
          )}

          {/* 🏅 「いちばん助かった」の確認（選び直しはできない） */}
          {baTarget && (
            <Dialog onClose={() => setBaTarget(null)} z={70}>
              <div className="p-5 space-y-4">
                <div className="text-center space-y-1">
                  <Icon n="workspace_premium" fill size={36} className="text-brand" />
                  <h3 className="font-head font-black text-[17px]">この回答を「いちばん助かった」に選びますか？</h3>
                </div>
                <p className="bg-sunk rounded-2xl p-3 text-[13px] leading-relaxed line-clamp-4">{baTarget.comment.text}</p>
                <div>
                  <label className={LABEL} htmlFor="ba-thanks">回答者へのお礼（任意）</label>
                  <textarea id="ba-thanks" rows="2" value={baThanks} onChange={(e) => setBaThanks(e.target.value)} placeholder="例：具体的で助かりました！" className={cx(INPUT, "leading-relaxed")} />
                </div>
                <ul className="text-[12px] text-sub space-y-0.5">
                  <li>・選び直しはできません</li>
                  <li>・質問は解決済みになり、回答の受付を終了します</li>
                </ul>
                <div className="flex gap-2">
                  <button onClick={() => setBaTarget(null)} className={cx(BTN_SOFT, "flex-1")}>やめる</button>
                  <button onClick={confirmBestAnswer} className={cx(BTN_PRIMARY, "flex-1")}>決定する</button>
                </div>
              </div>
            </Dialog>
          )}

          {/* 🏪 お店で使う（非接触：お店のQRを読む → スライドで確定 → 完了画面を見せる） */}
          {activeCouponForUse && (
            <StoreRedeemScreen
              key={activeCouponForUse.id}
              coupon={activeCouponForUse}
              onClose={() => setActiveCouponForUse(null)}
              onRedeem={handleUseCoupon}
            />
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- 📱 Service Worker 登録スクリプト (PWA化対応) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker 登録成功:', reg.scope))
          .catch((err) => console.log('Service Worker 登録失敗:', err));
      });
    }
  </script>
</body>
</html>
