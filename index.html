<!DOCTYPE html>
<html lang="ja" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <!-- スマホの画面幅に合わせて自動スケーリングするメタタグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>大学生向けリアル情報ポータル｜TUNAGARI</title>
  <meta name="color-scheme" content="light dark">

  <!-- 📱 PWA用設定タグ -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6f7f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121313" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="リアルポータル">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <!-- Tailwind CSS CDN（色はすべてCSS変数＝デザイントークン経由。ライト/ダークはここで一括切替） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: 'rgb(var(--bg) / <alpha-value>)',
            surface: 'rgb(var(--surface) / <alpha-value>)',
            sunk: 'rgb(var(--sunk) / <alpha-value>)',
            line: 'rgb(var(--line) / <alpha-value>)',
            ink: 'rgb(var(--ink) / <alpha-value>)',
            sub: 'rgb(var(--sub) / <alpha-value>)',
            mute: 'rgb(var(--mute) / <alpha-value>)',
            brand: 'rgb(var(--brand) / <alpha-value>)',
            'brand-deep': 'rgb(var(--brand-deep) / <alpha-value>)',
            'brand-tint': 'rgb(var(--brand-tint) / <alpha-value>)',
            'on-brand': 'rgb(var(--on-brand) / <alpha-value>)',
            ask: 'rgb(var(--ask) / <alpha-value>)',
            'ask-tint': 'rgb(var(--ask-tint) / <alpha-value>)',
            'ask-ink': 'rgb(var(--ask-ink) / <alpha-value>)',
            love: 'rgb(var(--love) / <alpha-value>)',
            'love-tint': 'rgb(var(--love-tint) / <alpha-value>)',
            'love-ink': 'rgb(var(--love-ink) / <alpha-value>)',
            danger: 'rgb(var(--danger) / <alpha-value>)',
            'danger-tint': 'rgb(var(--danger-tint) / <alpha-value>)',
            'danger-ink': 'rgb(var(--danger-ink) / <alpha-value>)',
            sky: 'rgb(var(--sky) / <alpha-value>)',
            'sky-tint': 'rgb(var(--sky-tint) / <alpha-value>)',
            'sky-ink': 'rgb(var(--sky-ink) / <alpha-value>)'
          },
          fontFamily: {
            head: ['-apple-system', 'BlinkMacSystemFont', '"Hiragino Sans"', '"Hiragino Kaku Gothic ProN"', '"Yu Gothic UI"', 'Meiryo', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            soft: 'var(--shadow-soft)',
            lift: 'var(--shadow-lift)'
          }
        }
      }
    };
  </script>
  <!-- アイコン（丸みのあるMaterial Symbols） -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <!-- フォント：端末のシステムフォント（Webフォントは読み込まない） -->
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- QRコード読み取り（店頭のお店QRを読むため） -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    /* ============================================================
       🎨 デザイントークン（色はRGB値。Tailwindの透明度指定 bg-brand/20 などが効く）
       ライト基本。端末がダークなら自動でダーク。手動切替は <html data-theme="light|dark">
       ============================================================ */
    :root {
      color-scheme: light;
      /* 無彩色（ロゴの文字グレー #6B6B6B に合わせた、色味のないグレー） */
      --bg: 246 247 247;
      --surface: 255 255 255;
      --sunk: 241 242 242;
      --line: 228 230 230;
      --ink: 34 37 37;
      --sub: 96 100 100;
      --mute: 112 116 116;
      /* プライマリー #35B597 */
      --brand: 53 181 151;
      --brand-deep: 28 128 104;   /* 白背景の上の文字・アイコン用（読みやすさのため少し濃く） */
      --brand-tint: 234 247 243;
      --on-brand: 255 255 255;
      /* 「質問」などの強調は色を増やさず、濃いグレーで表現 */
      --ask: 52 56 56;
      --ask-tint: 241 242 242;
      --ask-ink: 34 37 37;
      /* ハート（助かった！／気になる）だけに使う差し色 */
      --love: 240 104 96;
      --love-tint: 253 238 236;
      --love-ink: 196 64 56;
      --danger: 214 69 80;
      --danger-tint: 253 235 237;
      --danger-ink: 176 38 52;
      /* 旧ブルー（AI・案内）はグレー面＋ブランド文字に統一 */
      --sky: 53 181 151;
      --sky-tint: 241 242 242;
      --sky-ink: 28 128 104;
      --shadow-soft: 0 1px 2px rgb(0 0 0 / .04), 0 6px 16px -10px rgb(0 0 0 / .14);
      --shadow-lift: 0 2px 4px rgb(0 0 0 / .05), 0 16px 32px -16px rgb(0 0 0 / .22);
      --blob-a: 0 0 0 / 0;
      --blob-b: 0 0 0 / 0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: 18 19 19; --surface: 28 30 30; --sunk: 38 41 41; --line: 52 56 56;
        --ink: 236 238 238; --sub: 170 175 175; --mute: 140 145 145;
        --brand: 53 181 151; --brand-deep: 98 208 180; --brand-tint: 26 52 46; --on-brand: 255 255 255;
        --ask: 225 228 228; --ask-tint: 38 41 41; --ask-ink: 236 238 238;
        --love: 255 122 112; --love-tint: 62 32 30; --love-ink: 255 160 150;
        --danger: 255 120 130; --danger-tint: 62 28 32; --danger-ink: 255 168 174;
        --sky: 53 181 151; --sky-tint: 38 41 41; --sky-ink: 98 208 180;
        --shadow-soft: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 24px -14px rgb(0 0 0 / .7);
        --shadow-lift: 0 1px 0 rgb(255 255 255 / .04) inset, 0 18px 34px -16px rgb(0 0 0 / .8);
        --blob-a: 0 0 0 / 0;
        --blob-b: 0 0 0 / 0;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: 18 19 19; --surface: 28 30 30; --sunk: 38 41 41; --line: 52 56 56;
      --ink: 236 238 238; --sub: 170 175 175; --mute: 140 145 145;
      --brand: 53 181 151; --brand-deep: 98 208 180; --brand-tint: 26 52 46; --on-brand: 255 255 255;
      --ask: 225 228 228; --ask-tint: 38 41 41; --ask-ink: 236 238 238;
      --love: 255 122 112; --love-tint: 62 32 30; --love-ink: 255 160 150;
      --danger: 255 120 130; --danger-tint: 62 28 32; --danger-ink: 255 168 174;
      --sky: 53 181 151; --sky-tint: 38 41 41; --sky-ink: 98 208 180;
      --shadow-soft: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 24px -14px rgb(0 0 0 / .7);
      --shadow-lift: 0 1px 0 rgb(255 255 255 / .04) inset, 0 18px 34px -16px rgb(0 0 0 / .8);
      --blob-a: 0 0 0 / 0;
      --blob-b: 0 0 0 / 0;
    }

    /* ダークでは「濃いグレーのバッジ」が明るいグレーになるので、上の文字を反転 */
    :root[data-theme="dark"] .bg-ask.text-on-brand { color: rgb(var(--bg)); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bg-ask.text-on-brand { color: rgb(var(--bg)); } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: rgb(var(--bg)); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
      background-color: rgb(var(--bg));
      color: rgb(var(--ink));
      font-size: 14px;
      line-height: 1.6;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    button { font-family: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-visible {
      outline: 3px solid rgb(var(--brand) / .55);
      outline-offset: 2px;
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    /* シート・ダイアログの中のスクロールは、端まで来ても背面に伝えない */
    .fixed .overflow-y-auto { overscroll-behavior: contain; }

    /* アイコン（Material Symbols Rounded） */
    .ms {
      font-family: 'Material Symbols Rounded';
      font-weight: normal; font-style: normal; font-size: 20px; line-height: 1;
      letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap;
      -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased; user-select: none; flex-shrink: 0;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    .ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

    /* 背景のやわらかい色のにじみ（装飾） */
    .bg-blobs {
      background:
        radial-gradient(60% 40% at 0% 0%, rgb(var(--blob-a)) 0%, transparent 70%),
        radial-gradient(50% 35% at 100% 8%, rgb(var(--blob-b)) 0%, transparent 70%);
    }

    /* ガラス表現はナビとトーストの1層だけ（本文は常に不透明の面に置く） */
    .glass { background: rgb(var(--surface) / .94); border: 1px solid rgb(var(--line) / .8); }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      @media (prefers-reduced-transparency: no-preference) {
        .glass { background: rgb(var(--surface) / .72); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); }
      }
    }

    /* 動き：ばねのような軽い弾み。動きを減らす設定の端末では止める */
    .press { transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, background-color .2s; }
    .press:active { transform: scale(.96); }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(.8); opacity: 1; }
      50% { opacity: 1; }
      100% { transform: translateY(-64px) scale(1.4); opacity: 0; }
    }
    .animate-float-heart { animation: floatUp .85s cubic-bezier(.25,.46,.45,.94) forwards; }
    @keyframes springBounce {
      0% { transform: scale(1); } 35% { transform: scale(1.2); } 65% { transform: scale(.94); } 100% { transform: scale(1); }
    }
    .animate-bounce-click { animation: springBounce .38s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp .32s cubic-bezier(.22,1,.36,1); }
    /* 横に続きがある列の右端をぼかして、スクロールできることを示す */
    .fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-up { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    /* 完了画面：常に動き続けるバー（静止画＝スクリーンショットではないことの確認用） */
    @keyframes liveSweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    .live-sweep { animation: liveSweep 1.6s linear infinite; }
    /* 全画面ページ：右から入ってくる */
    /* 自己分析レポート */
    @keyframes revealUp { 0% { opacity: 0; transform: translateY(18px) scale(.96); } 100% { opacity: 1; transform: none; } }
    .animate-reveal { animation: revealUp .6s cubic-bezier(.22,1,.36,1) both; }
    @keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .animate-grow { transform-origin: left; animation: growX .9s cubic-bezier(.22,1,.36,1) both; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .animate-floaty { animation: floaty 3.2s ease-in-out infinite; }
    @keyframes pushIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .animate-push-in { animation: pushIn .28s cubic-bezier(.22,1,.36,1) both; }
    @keyframes stampIn { 0% { transform: scale(1.8) rotate(-12deg); opacity: 0; } 60% { transform: scale(.92) rotate(-12deg); opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: 1; } }
    .animate-stamp { animation: stampIn .45s cubic-bezier(.34,1.56,.64,1) both; }
    /* 読み取り枠のスキャンライン */
    @keyframes scanLine { 0% { top: 8%; } 50% { top: 88%; } 100% { top: 8%; } }
    .scan-line { animation: scanLine 2.4s ease-in-out infinite; }
    .animate-fade-in { animation: fadeIn .25s ease-out both; }
    @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -8px) scale(.94); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    .animate-pop { animation: popIn .28s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .shimmer-bg { background: linear-gradient(90deg, transparent 0%, rgb(255 255 255 / .35) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 3s infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="bg-bg text-ink min-h-screen overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}

    // ============================================================
    // 🏫 大学設定（ここ1か所を変えると、全画面の大学名・学部名・サンプルデータが切り替わります）
    //   ・通常は下の ACTIVE_UNIVERSITY を書き換えてください
    //   ・URL末尾に ?univ=otaru を付けて開くと、ファイルを書き換えずに切り替えて確認できます
    //   ・新しい大学を足すときは UNIVERSITIES に1ブロック追加するだけです
    // ============================================================
    const ACTIVE_UNIVERSITY = "otaru";

    const UNIVERSITIES = {
      hokudai: {
        name: "北海道大学",          // 正式名称
        short: "北大",               // 略称（「北大生」「北大認証済」などに使用）
        faculty: "経済学部",         // マイページ表示用の学部名（＝この学生が登録している学部）
        faculties: ["総合教育部（1年）", "文学部", "教育学部", "法学部", "経済学部", "理学部", "医学部", "歯学部", "薬学部", "工学部", "農学部", "獣医学部", "水産学部"],
        facultyShort: "経済",        // 投稿者表示用（例：経済3年）
        facultyBuilding: "経済学部2号館",
        building: "理学部2号館",     // 休講掲示板のサンプル用
        dining: "北部食堂",          // 学食のサンプル用
        website: "https://www.hokudai.ac.jp/",
        sns: [
          { label: "X（旧Twitter）", handle: "@HokkaidoUnivPR", url: "https://x.com/HokkaidoUnivPR", icon: "alternate_email" },
          { label: "Instagram", handle: "@hokkaidounivpr", url: "https://www.instagram.com/hokkaidounivpr/", icon: "photo_camera" }
        ],
        peerA: "総合理系", peerB: "物理", peerC: "文学部"  // 他学部の学生のサンプル表示用
      },
      otaru: {
        name: "小樽商科大学",
        short: "小樽商大",
        faculty: "商学部",
        faculties: ["商学部"],
        facultyShort: "商",
        facultyBuilding: "講義棟",
        building: "講義棟",
        dining: "学食",
        website: "https://www.otaru-uc.ac.jp/",
        sns: [],
        peerA: "商", peerB: "商", peerC: "商"
      }
    };

    const _univParam = new URLSearchParams(window.location.search).get("univ");
    const UNIV_ID = (_univParam && UNIVERSITIES[_univParam]) ? _univParam : ACTIVE_UNIVERSITY;
    const U = UNIVERSITIES[UNIV_ID];

    // 🎓 学部の新着まとめ
    //   ・同じ学部の学生が投稿した記事・質問を、1日1回（18時ごろ）まとめてお知らせに届ける
    //   ・投稿者が「どの学部向けか」を選ぶ機能はなし（学部・学年を指定して届けるのはプレミアムの検討機能のため）
    const DIGEST_HOUR = 18;   // まとめを届ける時刻の目安（本番はサーバーから配信）
    const facultyOf = (p) => p.authorFaculty || (typeof p.author === "string" && !p.author.includes("匿名") && p.author.startsWith(U.facultyShort) ? U.faculty : null);
    document.title = `キャンパスリアルポータル｜${U.name}`;

    // ============================================================
    // 💾 保存しない（プロトタイプのため、端末には何も残しません）
    //   ・投稿・回答・ポイントなどは画面を開いている間だけ使い、閉じる／再読み込みで初期状態に戻ります
    // ============================================================
    const STORAGE_PREFIX = `tunagari-proto-261015ai:${UNIV_ID}:`;

    // 🗳 プレミアム機能の投票の送り先（Google Apps Script の WebアプリURL を貼る）
    //   ・空のままだと、投票はこの端末にだけ保存されます（集計されません）
    //   ・URL末尾に ?test=1 を付けて開くと「テスト」として記録されます（チーム内の確認用）
    const VOTE_ENDPOINT = "https://script.google.com/macros/s/AKfycbyRuVrOiKST7qVfukwzhP_3nmJ2GqXDKyqRr3iJf63SsQ5MfFiPWFmt9sqG9nvUBO47mw/exec";

    // 端末には保存せず、メモリ上だけで持つ（名前は以前のまま）
    function usePersistentState(key, initialFactory) {
      return useState(initialFactory);
    }

    function clearAllPersisted() {
      try {
        Object.keys(window.localStorage)
          .filter(k => k.startsWith("tunagari-proto-261015ai:"))
          .forEach(k => window.localStorage.removeItem(k));
      } catch (e) {}
    }
    // 以前の版でこの端末に残ったデータがあれば、開いた時点で消す
    clearAllPersisted();

    // 画像は縮小して保存（localStorageの容量を守るため）
    function readAndDownscale(file, maxSide, done) {
      const reader = new FileReader();
      reader.onerror = () => done(null);
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(img.width * scale));
            c.height = Math.max(1, Math.round(img.height * scale));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            done(c.toDataURL("image/jpeg", 0.72));
          } catch (e) { done(reader.result); }
        };
        img.onerror = () => done(reader.result);
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    const IS_STANDALONE = (() => {
      try {
        return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
      } catch (e) { return false; }
    })();

    // ============================================================
    // 🗂 カテゴリ（授業を核に、暮らし・新歓まで）
    // ============================================================
    const CATEGORIES = [
      "授業・過去問",
      "休講・掲示板",
      "グルメ・学食",
      "作業スペース",
      "暮らし・家探し",
      "体調・健康",
      "新歓・サークル",
      "バイト・研究室",
      "その他"
    ];

    const REPORT_REASONS = [
      "誹謗中傷・個人や団体が特定できる内容",
      "虚偽・誤った情報",
      "広告・宣伝・勧誘",
      "その他"
    ];

    // ============================================================
    // 🤖 回答がつかない質問へのAI仮回答／回答が多い質問の「まとめ」
    //   ※ このデモでは文章を端末内のルールで作っています（外部のAIは呼びません）。
    //     本番では、サーバー側でAI（LLM）に生成させる想定です。
    // ============================================================
    const AI_FIRST_ANSWER_DELAY_MS = 4000;   // 学生の回答が付かないまま、この時間が過ぎたらAIが仮回答（本番は30分〜1時間を想定）
    const SUMMARY_MIN_ANSWERS = 10;          // 回答がこの件数以上になったら「みんなの回答まとめ」を表示

    // AIサポーターの文面（機械的にならないよう、やさしい話し言葉で。カテゴリごとに、気持ちに寄り添う一言＋参考になりそうなこと）
    const AI_INTROS = {
      "授業・過去問": "みんなの回答が届くまで、まずはここから。",

    function summarizeAnswers(comments) {
      const list = comments || [];
      const n = list.length;
      const totalThanks = list.reduce((a, c) => a + (c.thanks || 0), 0);
      const sorted = [...list].sort((a, b) => (b.thanks || 0) - (a.thanks || 0));
      const keywords = SUMMARY_KEYWORDS
        .map(k => ({ label: k.label, count: list.filter(c => k.re.test(c.text)).length }))
        .filter(k => k.count > 0)
        .sort((a, b) => b.count - a.count)
        .slice(0, 5)
        .map(k => ({ ...k, pct: Math.round((k.count / Math.max(n, 1)) * 100) }));
      const grades = {};
      let anon = 0;
      list.forEach(c => {
        const m = (c.user || "").match(/(\d)年/);
        if (m) grades[m[1]] = (grades[m[1]] || 0) + 1; else anon += 1;
      });
      let headline = `${n}件の回答が集まりました。`;
      if (keywords.length >= 2) {
        headline = `${n}件の回答のうち、${keywords[0].pct}%が「${keywords[0].label}」、${keywords[1].pct}%が「${keywords[1].label}」に触れていました。`;
        if (keywords.length >= 4) headline += `「${keywords[2].label}」「${keywords[3].label}」を挙げる声もあります。`;
      } else if (keywords.length === 1) {
        headline = `${n}件の回答のうち、${keywords[0].pct}%が「${keywords[0].label}」に触れていました。`;
      }
      return { n, totalThanks, headline, keywords, grades, anon, best: sorted[0] || null, top: sorted.slice(0, 3) };
    }

        photo: "https://images.unsplash.com/photo-1521017432531-fbd92d768814?w=600&auto=format&fit=crop&q=60",
        access: "西改札 徒歩6分", address: "札幌市北区北6条西6丁目", hoursText: "9:00–23:00", closedText: "なし",
        hours: [[540, 1380]], closed: [], note: "Wi-Fi・電源・ドリンク飲み放題",
        ticket: { title: "2時間 無料", detail: "通常2時間800円のプラン", cost: 150 }
      }
    ];
    const STORES = Object.fromEntries(PARTNER_STORES.map(s => [s.id, s.name]));

    // 🎁 WS版：ポイントの交換先（仮）＝楽天ポイント。交換レートはたたき（cost＝必要なTUNAGARIポイント、amount＝受け取る楽天ポイント）
    const EXCHANGE_NAME = "楽天ポイント";
    const EXCHANGE_PLANS = [
      { id: "r50", cost: 100, amount: 50 },
      { id: "r100", cost: 200, amount: 100 },
      { id: "r300", cost: 500, amount: 300, badge: "おトク" }
    ];
    function PlanThumb({ plan, className }) {
      return (
        <span className={cx("bg-brand-tint text-brand-deep flex flex-col items-center justify-center leading-none", className)}>
          <span className="font-head font-black text-[26px] tabular-nums">{plan.amount}</span>
          <span className="text-[10px] font-bold mt-1">{EXCHANGE_NAME}</span>
        </span>
      );
    }
    const storeById = (id) => PARTNER_STORES.find(s => s.id === id);
    // 今、営業中か（定休日・昼休みも考慮）
    function isOpenNow(store, ms = Date.now()) {
      const d = new Date(ms);
      if (store.closed.includes(d.getDay())) return false;
      const m = d.getHours() * 60 + d.getMinutes();
      return store.hours.some(([a, b]) => m >= a && m < b);
    }
    const mapUrl = (store) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.address + " " + store.name)}`;
    const TICKET_VALID_DAYS = 30;
    // 「店員さんに見せる画面」を表示できる時間（使用してから。過ぎると履歴だけになり、提示には使えません）
    const PRESENT_LIMIT_MIN = 3;

    // 🎁 ポイントがもらえるのは、この3つだけ（「気になる」ではもらえません）
    //   ・「助かった！」は押した人に+1。取り消すと-1（押し直しで増やせない）。自分の投稿・回答には付かない
    const POINT_RULES = {
      share: 10,    // 情報を投稿した（質問の投稿は対象外）
      thanks: 1,    // 「助かった！」を押した（投稿・回答どちらでも）
      answer: 3     // 質問に回答した
    };

    // お店の写真（読み込めないときはアイコン）
    function StoreThumb({ store, className, iconSize = 28 }) {
      const [bad, setBad] = useState(false);
      return (
        <div className={cx("relative overflow-hidden bg-brand-tint flex items-center justify-center flex-shrink-0", className)}>
          {store.photo && !bad
            ? <img src={store.photo} alt={`${store.name}の写真`} loading="lazy" onError={() => setBad(true)} className="absolute inset-0 w-full h-full object-cover" />

        </div>
      );
    }
    function OpenBadge({ store }) {
      const open = isOpenNow(store);
      return (
        <span className={cx("inline-flex items-center gap-1 text-[11px] font-bold", open ? "text-brand-deep" : "text-mute")}>
          <span className={cx("w-1.5 h-1.5 rounded-full", open ? "bg-brand" : "bg-mute/60")}></span>{open ? "営業中" : "営業時間外"}
        </span>
      );
    }
    const QR_PREFIX = "TUNAGARI";

    const pad2 = (n) => String(n).padStart(2, "0");
    const fmtDateTime = (ms) => { const d = new Date(ms); return `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
    const fmtClock = (ms) => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
    const fmtDay = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`; };
    // ISO週（月曜はじまり）。例：2026-W42
    function isoWeekKey(ms) {
      const d = new Date(ms);
      const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const day = t.getUTCDay() || 7;
      t.setUTCDate(t.getUTCDate() + 4 - day);
      const y = t.getUTCFullYear();
      const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7);
      return `${y}-W${pad2(w)}`;
    }
    const storeQrText = (storeId, ms) => `${QR_PREFIX}|${UNIV_ID}|${storeId}|${isoWeekKey(ms)}`;
    // 読み取った文字を確認 → { ok, storeId, storeName } か { ok:false, reason }
    function checkStoreQr(text) {
      const parts = String(text || "").trim().split("|");
      if (parts.length !== 4 || parts[0] !== QR_PREFIX) return { ok: false, reason: "お店のQRではありません" };
      const [, univ, storeId, week] = parts;
      if (univ !== UNIV_ID || !STORES[storeId]) return { ok: false, reason: "このクーポンが使えないお店です" };
      const now = Date.now();
      const valid = [isoWeekKey(now), isoWeekKey(now - 7 * 86400000)];   // 今週＋先週（貼り替え忘れの猶予）
      if (!valid.includes(week)) return { ok: false, reason: "このQRは期限切れです。店員さんにお知らせください" };
      return { ok: true, storeId, storeName: STORES[storeId] };
    }

    function useNow(interval = 1000) {
      const [t, setT] = useState(Date.now());
      useEffect(() => { const i = setInterval(() => setT(Date.now()), interval); return () => clearInterval(i); }, [interval]);
      return t;
    }

    // カメラでQRを読む（対応端末はBarcodeDetector、それ以外はjsQR）
    function QrScanner({ onResult }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [error, setError] = useState("");
      const doneRef = useRef(false);
      useEffect(() => {
        let stream = null, raf = 0, detector = null, stopped = false;
        const stop = () => { stopped = true; cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); };
        const emit = (txt) => { if (doneRef.current || !txt) return; doneRef.current = true; stop(); onResult(txt); };
        (async () => {
          try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no-camera");
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            if (stopped) { stream.getTracks().forEach(t => t.stop()); return; }
            const v = videoRef.current;
            v.srcObject = stream; v.setAttribute("playsinline", ""); await v.play();
            if ("BarcodeDetector" in window) { try { detector = new window.BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; } }
            const tick = async () => {
              if (stopped) return;
              if (v.readyState >= 2) {
                try {
                  if (detector) {
                    const r = await detector.detect(v);
                    if (r && r[0]) return emit(r[0].rawValue);
                  } else if (window.jsQR) {
                    const c = canvasRef.current, w = 480, hh = Math.round(480 * (v.videoHeight / Math.max(1, v.videoWidth)));
                    c.width = w; c.height = hh;
                    const ctx = c.getContext("2d", { willReadFrequently: true });
                    ctx.drawImage(v, 0, 0, w, hh);
                    const img = ctx.getImageData(0, 0, w, hh);
                    const code = window.jsQR(img.data, w, hh, { inversionAttempts: "dontInvert" });
                    if (code && code.data) return emit(code.data);
                  }
                } catch (e) { /* 次のフレームで再試行 */ }
              }
              raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
          } catch (e) {
            setError("カメラを使えませんでした。ブラウザの設定でカメラを許可してください");
          }
        })();
        return stop;
      }, []);
      return (
        <div className="relative w-full aspect-square rounded-3xl overflow-hidden bg-black">
          <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" muted playsInline></video>
          <canvas ref={canvasRef} className="hidden"></canvas>
          {/* 読み取り枠 */}
          <div className="absolute inset-[12%] rounded-3xl border-[3px] border-white/90 pointer-events-none">
            <div className="absolute left-3 right-3 h-0.5 bg-brand shadow-[0_0_12px_rgb(53_181_151)] scan-line"></div>
          </div>
          {error && (
            <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 p-6 text-center bg-black/80">
              <Icon n="no_photography" size={36} className="text-white/70" />
              <p className="text-[13px] text-white/85 leading-relaxed">{error}</p>
            </div>
          )}
        </div>
      );
    }

    // スライドして確定（端まで動かさないと確定しない。途中で離すと戻る）
    function SlideToConfirm({ label, onDone }) {
      const track = useRef(null);
      const [x, setX] = useState(0);
      const [drag, setDrag] = useState(false);
      const startX = useRef(0);
      const KNOB = 56;
      const maxX = () => (track.current ? track.current.clientWidth - KNOB - 8 : 240);
      const down = (e) => {
        startX.current = e.clientX - x; setDrag(true);
        if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }
      };
      const move = (e) => { if (drag) setX(Math.min(maxX(), Math.max(0, e.clientX - startX.current))); };
      const up = () => {
        if (!drag) return;
        setDrag(false);
        if (x >= maxX() * 0.94) { setX(maxX()); setTimeout(onDone, 120); } else setX(0);
      };
      const pct = Math.min(1, x / Math.max(1, maxX()));
      return (
        <div ref={track} className="relative h-16 rounded-full bg-white/10 border border-white/15 overflow-hidden select-none touch-none">
          <div className="absolute inset-y-0 left-0 bg-brand/35 rounded-full" style={{ width: x + KNOB + 8 }}></div>
          <span className="absolute inset-0 flex items-center justify-center pl-14 text-[15px] font-black text-white pointer-events-none" style={{ opacity: Math.max(0, 1 - pct * 1.6) }}>
            {label}
          </span>
          <button
            type="button"
            onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
            aria-label={label}
            className="absolute top-1 left-1 w-14 h-14 rounded-full bg-brand text-white flex items-center justify-center shadow-lift cursor-grab touch-none"
            style={{ transform: `translateX(${x}px)`, transition: drag ? "none" : "transform .25s cubic-bezier(.22,1,.36,1)" }}
          >
            <Icon n="keyboard_double_arrow_right" size={30} />
          </button>
        </div>
      );
    }

    // お店で使う（全画面）：QR読み取り → スライドで確定 → 完了画面を見せる
    // 🔒 ボトムシート・ダイアログ表示中は、背面のページをスクロールさせない
    //   ・開いている数を数えて、すべて閉じたときだけ元に戻す（シートの上にシートが重なっても大丈夫）
    //   ・スクロールバーが消えてもレイアウトがずれないよう、その幅だけ右に余白を足す
    let _scrollLocks = 0;
    function useScrollLock() {
      useEffect(() => {
        const html = document.documentElement, body = document.body;
        if (_scrollLocks++ === 0) {
          const bar = window.innerWidth - html.clientWidth;
          html.style.overflow = "hidden";
          body.style.overflow = "hidden";
          html.style.overscrollBehavior = "none";
          if (bar > 0) body.style.paddingRight = `${bar}px`;
        }
        return () => {
          if (--_scrollLocks === 0) {
            html.style.overflow = "";
            body.style.overflow = "";
            html.style.overscrollBehavior = "";
            body.style.paddingRight = "";
          }
        };
      }, []);
    }
    function ScrollLock() { useScrollLock(); return null; }

    function StoreRedeemScreen({ coupon, onClose, onRedeem }) {
      useScrollLock();
      const now = useNow(1000);
      // 提示できる残り時間（使用から PRESENT_LIMIT_MIN 分。過ぎたら「履歴」表示に切り替え、何度も提示できないようにする）
      const presentLeft = coupon.usedAt ? PRESENT_LIMIT_MIN * 60000 - (now - coupon.usedAt) : 0;
      const [step, setStep] = useState(coupon.isUsed ? (presentLeft > 0 ? "done" : "history") : "scan");   // scan → confirm → done →（時間切れ）history
      useEffect(() => { if (step === "done" && coupon.usedAt && presentLeft <= 0) setStep("history"); }, [step, presentLeft, coupon.usedAt]);
      const leftLabel = `${Math.floor(Math.max(0, presentLeft) / 60000)}:${String(Math.floor(Math.max(0, presentLeft) / 1000) % 60).padStart(2, "0")}`;
      const bodyRef = useRef(null);
      useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [step]);
      const [scan, setScan] = useState(null);       // { storeId, storeName, at }
      const [scanError, setScanError] = useState("");
      const handleScan = (text) => {
        const r = checkStoreQr(text);
        if (!r.ok) { setScanError(r.reason); return false; }
        if (coupon.storeId && r.storeId !== coupon.storeId) {
          setScanError(`このチケットは「${STORES[coupon.storeId] || "別のお店"}」で使えます`);
          return false;
        }
        setScanError("");
        setScan({ storeId: r.storeId, storeName: r.storeName, at: Date.now() });
        setStep("confirm");
        return true;
      };
      const [scanKey, setScanKey] = useState(0);   // 読み取りやり直し用

      return (
        <div className="fixed inset-0 z-[80] bg-[#151717] text-white flex flex-col animate-fade-in" style={{ paddingTop: "max(1rem, env(safe-area-inset-top))", paddingBottom: "max(1rem, env(safe-area-inset-bottom))" }}>
          <div ref={bodyRef} className="w-full max-w-md mx-auto flex-1 flex flex-col px-5 gap-4 overflow-y-auto">
            <div className="flex items-center justify-between">
              <span className="inline-flex items-center gap-1.5 bg-white text-[#151717] text-[12px] font-black px-3 py-1.5 rounded-full">
                <Icon n="storefront" fill size={16} />お店で使う
              </span>
              <button onClick={onClose} aria-label="閉じる" className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center press">
                <Icon n="close" size={22} />
              </button>
            </div>

            {/* 手順の現在地 */}
            {step !== "history" && <div className="flex items-center gap-1.5 text-[12px] font-bold">
              {[["scan", "QRを読む"], ["confirm", "スライド"], ["done", "見せる"]].map(([k, l], i) => {
                const idx = ["scan", "confirm", "done"].indexOf(step);
                const on = i <= idx;
                return (
                  <React.Fragment key={k}>
                    {i > 0 && <span className={cx("flex-1 h-px", on ? "bg-brand" : "bg-white/15")}></span>}
                    <span className={cx("flex items-center gap-1", on ? "text-white" : "text-white/40")}>
                      <span className={cx("w-5 h-5 rounded-full text-[11px] flex items-center justify-center", on ? "bg-brand text-white" : "bg-white/10")}>{i + 1}</span>{l}
                    </span>
                  </React.Fragment>
                );
              })}
            </div>}

            {step === "scan" && (
              <div className="space-y-3 animate-fade-in">
                <p className="text-center font-head font-black text-[18px]">レジにあるお店のQRを読み取ってください</p>
                <QrScanner key={scanKey} onResult={(t) => { if (!handleScan(t)) setTimeout(() => setScanKey(k => k + 1), 1800); }} />
                {scanError && <p className="text-center text-[13px] font-bold text-[#ff8a8a]">{scanError}</p>}
                <div className="rounded-2xl bg-white/5 px-4 py-3 text-[12px] text-white/70 flex justify-between gap-2">
                  <span className="font-bold text-white truncate">{coupon.title}</span>
                  {coupon.expires && <span className="flex-shrink-0">期限 {coupon.expires}</span>}
                </div>
                {/* デモ用：カメラが使えないPCでも流れを確認できるように */}
                <button onClick={() => handleScan(storeQrText(coupon.storeId || PARTNER_STORES[0].id, Date.now()))} className="w-full text-[12px] text-white/45 underline py-1">
                  デモ：読み取ったことにする（{STORES[coupon.storeId] || PARTNER_STORES[0].name}）
                </button>
              </div>
            )}

            {step === "confirm" && scan && (
              <div className="flex-1 flex flex-col gap-4 animate-fade-in">
                <div className="rounded-3xl bg-white text-[#222] p-5 text-center space-y-1">
                  <p className="text-[12px] font-bold text-[#1c8068] flex items-center justify-center gap-1"><Icon n="check_circle" fill size={16} />{scan.storeName} を確認しました</p>
                  <p className="font-head font-black text-[20px] leading-snug pt-1">{coupon.title}</p>
                  <p className="text-[12px] text-[#666]">{coupon.code}</p>
                </div>
                <div className="flex-1"></div>
                <div className="space-y-3">
                  <p className="text-center text-[13px] text-white/85 font-bold">レジでお会計のときにスライド</p>
                  <SlideToConfirm label="スライドして使う" onDone={() => { onRedeem(coupon.id, scan); setStep("done"); }} />
                  <p className="text-center text-[11px] text-white/50">スライドすると使用済みになり、取り消せません</p>
                </div>
              </div>
            )}

            {step === "done" && coupon.usedAt && (
              <div className="flex-1 flex flex-col gap-4 animate-fade-in">
                <p className="text-center font-head font-black text-[18px]">この画面を店員さんに見せてください</p>
                {/* 生きている画面の証明：秒まで動く時計＋動き続けるバー */}
                <div className="rounded-3xl bg-white/5 border border-white/10 p-4 text-center space-y-1.5">
                  <p className="text-[12px] text-white/60">{fmtDay(now)}</p>
                  <p className="font-head font-black text-[40px] leading-none tracking-wider tabular-nums">{fmtClock(now)}</p>
                  <div className="h-1.5 rounded-full bg-white/10 overflow-hidden mt-2">
                    <div className="h-full w-1/3 bg-brand rounded-full live-sweep"></div>
                  </div>
                  <p className="text-[11px] text-white/50">時計とバーが動いていれば、本物の画面です</p>
                  <p className="text-[13px] font-black text-[#ffd479] pt-1 tabular-nums">表示できるのは あと {leftLabel}</p>
                </div>
                <div className="relative rounded-3xl bg-white text-[#222] p-5 pb-8 text-center space-y-1 overflow-hidden">
                  <p className="font-head font-black text-[20px] leading-snug">{coupon.title}</p>
                  <p className="text-[12px] text-[#666]">{coupon.code}</p>
                  <div className="absolute right-3 bottom-2 pointer-events-none">
                    <span className="animate-stamp inline-block border-[3px] border-[#d64550] text-[#d64550] font-head font-black text-[18px] px-3 py-0.5 rounded-xl bg-white/90">使用済み</span>
                  </div>
                </div>
                <div className="rounded-3xl bg-white/5 border border-white/10 p-4 space-y-2 text-[13px]">
                  {[
                    ["使用日時", fmtDateTime(coupon.usedAt)],
                    ["店舗", coupon.store],
                    ["受付番号", coupon.receipt]
                  ].map(([k, val]) => (
                    <div key={k} className="flex justify-between gap-3">
                      <span className="text-white/55">{k}</span>
                      <span className="font-bold tabular-nums text-right">{val}</span>
                    </div>
                  ))}
                </div>
                <div className="flex-1"></div>
                <button onClick={onClose} className={cx(BTN_PRIMARY, "w-full")}>とじる</button>
                <p className="text-center text-[11px] text-white/50">使用から{PRESENT_LIMIT_MIN}分たつと、この画面は表示できなくなります</p>

    // 入力欄・ボタンの共通スタイル
    const INPUT = "w-full bg-sunk text-ink placeholder:text-mute rounded-2xl px-4 py-3 text-[14px] outline-none border border-transparent focus:border-brand focus:bg-surface transition-colors";
    const BTN_PRIMARY = "bg-brand text-on-brand font-black rounded-2xl py-3.5 text-[15px] tracking-wide shadow-soft press disabled:opacity-50";

    function Icon({ n, fill, size, className }) {
      return (

      );

    // 学部・学年の頭文字を丸いアイコンに（匿名は人型アイコン）
    const AVATAR_TONES = ["bg-sunk text-sub"];
    function Avatar({ name, size = 40 }) {
      const label = (name || "").replace("（あなた）", "");
      const anon = !label || label.includes("匿名");
      const m = label.match(/^(.)[^\d]*(\d)年/);
      const text = anon ? null : (m ? `${m[1]}${m[2]}` : label.charAt(0));
      let h = 0;
      for (const ch of label) h = (h * 31 + ch.charCodeAt(0)) % 997;
      const tone = anon ? "bg-sunk text-mute" : AVATAR_TONES[h % AVATAR_TONES.length];
      return (
        <div
          className={cx("rounded-full flex items-center justify-center font-head font-black flex-shrink-0", tone)}
          style={{ width: size, height: size, fontSize: size * 0.36 }}
          aria-hidden="true"
        >
          {anon ? <Icon n="person" fill size={size * 0.55} /> : text}
        </div>
      );
    }

    function CategoryChip({ children }) {
      return <span className="bg-brand-tint text-brand-deep text-[12px] font-bold px-2.5 py-0.5 rounded-full">{children}</span>;
    }
    function QuestionBadge() {
      return (
        <span className="border border-line text-sub text-[11px] font-bold px-2 py-[1px] rounded-full inline-flex items-center gap-0.5">
          <Icon n="help" size={13} />質問
        </span>
      );

    // ボトムシート（外側タップで閉じる）
    function Sheet({ onClose, z = 50, children, tone }) {
      useScrollLock();
      // 上のつまみ（バー）を下に引くと閉じる。一定以上引くか、勢いよく離すと閉じ、足りなければ元の位置に戻る
      const [dy, setDy] = useState(0);
      const [dragging, setDragging] = useState(false);
      const drag = useRef({ y: null, t: 0, v: 0, last: 0 });
      const onDown = (e) => {
        if (e.preventDefault) e.preventDefault();
        drag.current = { y: e.clientY, t: Date.now(), v: 0, last: e.clientY };
        setDragging(true);
        if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }
      };
      const onMove = (e) => {
        if (drag.current.y == null) return;
        const now = Date.now();
        const dt = Math.max(1, now - drag.current.t);
        drag.current.v = (e.clientY - drag.current.last) / dt;
        drag.current.last = e.clientY; drag.current.t = now;
        setDy(Math.max(0, e.clientY - drag.current.y));
      };
      const onUp = () => {
        if (drag.current.y == null) return;
        const fast = drag.current.v > 0.6;
        drag.current.y = null;
        setDragging(false);
        if (dy > 110 || (fast && dy > 30)) onClose(); else setDy(0);
      };
      return (
        <div className={cx("fixed inset-0 flex items-end justify-center animate-fade-in")} style={{ zIndex: z, background: `rgb(10 20 18 / ${Math.max(0.12, 0.5 - dy / 700)})`, touchAction: "none" }} onClick={onClose}>
          <div
            className={cx("bg-surface text-ink w-full max-w-md rounded-t-[2rem] max-h-[90vh] flex flex-col overflow-hidden animate-slide-up shadow-lift", tone)}
            style={{ transform: dy ? `translateY(${dy}px)` : undefined, transition: dragging ? "none" : "transform .25s cubic-bezier(.22,1,.36,1)" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div
              className="pt-3 pb-2 flex justify-center cursor-grab touch-none select-none"
              onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
              role="presentation"
            >
              <div className="w-10 h-1.5 bg-line rounded-full"></div>
            </div>
            {children}
          </div>
        </div>
      );
    }
    function SheetHeader({ title, icon, onClose, right }) {
      return (
        <div className="px-5 py-2 flex justify-between items-center gap-2">
          <h3 className="font-head font-black text-[17px] flex items-center gap-2 min-w-0">
            {icon && <Icon n={icon} fill className="text-brand-deep" />}
            <span className="truncate">{title}</span>
          </h3>
          <div className="flex items-center gap-1 flex-shrink-0">
            {right}
            {onClose && (
              <button onClick={onClose} aria-label="閉じる" className="w-9 h-9 rounded-full bg-sunk text-sub flex items-center justify-center press">
                <Icon n="close" size={20} />
              </button>
            )}
          </div>
        </div>
      );
    }

    // 投稿カード（フィード・検索結果で共通）
    function PostCard({ post, idx, topPick, unread, tokens, onTag, onOpen, onThanks }) {
      const isQ = post.type === "question";
      return (
        <article
          onClick={onOpen}
          className={cx("relative bg-surface rounded-3xl p-4 shadow-soft border cursor-pointer press animate-fade-up w-full break-words", unread > 0 ? "border-brand/60 ring-2 ring-brand/15" : "border-line/70")}
          style={{ animationDelay: `${Math.min(idx, 6) * 45}ms` }}
        >
          {topPick && (
            <div className="absolute -top-3 right-4 bg-brand text-on-brand text-[12px] font-black px-2.5 py-1 rounded-full shadow-soft flex items-center gap-1">
              <Icon n="stars" fill size={14} />おすすめ
            </div>
          )}
          {post.image && (
            <div className="-mx-4 -mt-4 mb-3 rounded-t-3xl overflow-hidden aspect-[16/9] bg-sunk">
              <img src={post.image} alt="投稿写真" className="w-full h-full object-cover" loading="lazy" />
            </div>
          )}
          <div className="flex items-center gap-2">
            <CategoryChip>{post.category}</CategoryChip>
            <div className="min-w-0 flex-1 text-[12px] text-mute truncate">{post.author.replace("（あなた）", "")}・{post.time}</div>
            {unread > 0 && (
              <span className="bg-brand text-on-brand text-[11px] font-black px-2 py-0.5 rounded-full inline-flex items-center gap-0.5">
                新着{unread > 1 ? ` ${unread}` : ""}
              </span>
            )}
            {isQ && <QuestionBadge />}
          </div>

          <h2 className="font-head font-bold text-[16px] leading-snug text-ink mt-2 break-words"><Highlight text={post.title.replace(/^【質問】\s*/, "")} tokens={tokens} /></h2>
          {tokens && tokens.length > 0 && <p className="text-[13px] text-sub mt-1 line-clamp-1 break-words"><Highlight text={post.content} tokens={tokens} /></p>}


          <div className="flex justify-between items-center mt-3">
            <div className="flex gap-3 text-mute text-[12px] items-center">
                            <span className="flex items-center gap-1">
                <Icon n="chat_bubble" size={16} />{post.commentsCount}
                {isQ && post.commentsCount === 0 && <span className="text-brand-deep font-bold">{post.ai ? "AIが返信" : "回答募集中"}</span>}
                {isQ && post.commentsCount >= SUMMARY_MIN_ANSWERS && (
                  <span className="bg-brand-tint text-brand-deep text-[12px] font-black px-2 py-0.5 rounded-full inline-flex items-center gap-0.5 ml-1">
                    <Icon n="auto_awesome" fill size={12} />まとめ
                  </span>
                )}
              </span>
            </div>
            <button
              onClick={onThanks}
              className={cx(
                "flex items-center gap-1 px-3 py-1.5 rounded-full font-bold text-[13px] press",
                post.isLiked ? "text-love-ink bg-love-tint animate-bounce-click" : "text-mute"
              )}
              aria-label={isQ ? "気になる" : "助かった！"}
            >
              <Icon n="favorite" fill={post.isLiked} size={18} className={post.isLiked ? "text-love" : ""} />
              <span>{post.thanks}</span>
            </button>
          </div>
        </article>
      );

    // ============================================================
    // 🖼 フィードの見た目（文字だけの一覧にならないように）
    //   ・写真がない投稿は、タイトルを大きく載せた「表紙」を自動で作る
    //   ・フィードは「セクション型（A案）」：質問の横スクロール → お店のチケット → 2列ボード
    // ============================================================
    const CATEGORY_META = {
      "授業・過去問": { icon: "school", short: "授業・過去問" },
      "休講・掲示板": { icon: "campaign", short: "休講" },
      "グルメ・学食": { icon: "restaurant", short: "グルメ" },
      "作業スペース": { icon: "chair", short: "作業場所" },
      "暮らし・家探し": { icon: "home", short: "暮らし" },
      "体調・健康": { icon: "healing", short: "体調" },
      "新歓・サークル": { icon: "celebration", short: "サークル" },
      "バイト・研究室": { icon: "work", short: "バイト" },
      "その他": { icon: "more_horiz", short: "その他" }
    };
    const catMeta = (c) => CATEGORY_META[c] || { icon: "article", short: c };
    const plainTitle = (t) => String(t || "").replace(/^【質問】\s*/, "");

    // 🔗 似ている質問を探す（投稿前に「一緒に回答を待つ」を選べるようにする）
    //   ・プロトタイプ：文字の重なり（2文字ずつ）＋カテゴリの一致で判定
    //   ・本番：AIで文章の意味の近さを判定する想定（言い回しがちがっても見つけられる）
    const SIM_STOP = /^【質問】|[【】「」『』（）()、。，．・？?！!～〜\s\u3000]|ですか|ますか|ました|ません|ください|ありますか|みんな|教えて|について|知りたい|どこ|どう|何を|なに/g;
    const simGrams = (t) => { const s = String(t || "").replace(SIM_STOP, ""); const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g; };
    function findSimilarQuestions(posts, title, category, isHidden) {
      const q = simGrams(title);
      if (q.size < 3) return [];
      return posts
        .filter(p => p.type === "question" && !isMineName(p.author) && !(isHidden && isHidden(p)))
        .map(p => {
          const tg = simGrams(p.title), cg = simGrams(p.content);
          let hit = 0, hitT = 0;
          q.forEach(g => { if (tg.has(g)) { hit++; hitT++; } else if (cg.has(g)) hit += 0.5; });
          return { p, hitT, score: hit / q.size + (p.category === category ? 0.1 : 0) };
        })
        .filter(x => x.hitT >= 2 && x.score >= 0.3)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3)
        .map(x => x.p);
    }

    // 文字だけの投稿の表紙（タイトルを主役に。色は3トーンを順番に）
    const COVER_TONES = [
      { box: "bg-brand text-white", chip: "bg-white/20 text-white", q: "text-white/15" },
      { box: "bg-brand-tint text-ink", chip: "bg-surface text-brand-deep", q: "text-brand/20" },
      { box: "bg-[#2b2f2f] text-white", chip: "bg-white/15 text-white", q: "text-white/10" }
    ];
    function TextCover({ post, className, titleSize = 17, tokens }) {
      const tone = COVER_TONES[post.id % COVER_TONES.length];
      const m = catMeta(post.category);
      return (
        <div className={cx("relative overflow-hidden p-3.5 flex flex-col", tone.box, className)}
          style={{ backgroundImage: "radial-gradient(rgb(255 255 255 / .10) 1px, transparent 1px)", backgroundSize: "14px 14px" }}>
          <span className={cx("self-start inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full", tone.chip)}>
            <Icon n={m.icon} fill size={13} />{m.short}
          </span>
          <p className="font-head font-black leading-snug mt-auto line-clamp-4 relative" style={{ fontSize: titleSize }}><Highlight text={plainTitle(post.title)} tokens={tokens} markClass="bg-white/35 text-inherit rounded px-0.5" /></p>
          {post.type === "question" && (
            <span className={cx("absolute -right-1 -bottom-6 font-head font-black leading-none pointer-events-none select-none", tone.q)} style={{ fontSize: 120 }} aria-hidden="true">Q</span>
          )}
        </div>
      );
    }

    // ボード（2列）のカード：写真 or 表紙 ＋ 最小限の情報
    function BoardCard({ post, idx, onOpen, onThanks, unread, unreadLabel, tokens, topPick, onTag }) {
      const [bad, setBad] = useState(false);
      const mine = isMineName(post.author);
      const hasImg = !!post.image && !bad;
      const isQ = post.type === "question";
      return (
        <article onClick={onOpen} className={cx("break-inside-avoid mb-3 bg-surface rounded-3xl overflow-hidden border shadow-soft cursor-pointer press animate-fade-up relative", mine ? "border-brand ring-2 ring-brand/20" : "border-line/70")} style={{ animationDelay: `${Math.min(idx, 8) * 40}ms` }}>
          {hasImg
            ? <div className="aspect-[4/5] bg-sunk"><img src={post.image} alt="" loading="lazy" onError={() => setBad(true)} className="w-full h-full object-cover" /></div>
            : <TextCover post={post} tokens={tokens} className={post.id % 2 ? "aspect-[4/5]" : "aspect-square"} titleSize={16} />}
          
          <div className="p-3 space-y-1.5">
            {unread > 0 && <span className="inline-flex items-center gap-0.5 bg-brand text-on-brand text-[11px] font-black px-2 py-0.5 rounded-full"><Icon n="notifications_active" fill size={12} />{unreadLabel || "新着"}</span>}
            {topPick && <span className="inline-flex items-center gap-0.5 text-[11px] font-black text-brand-deep"><Icon n="stars" fill size={14} />いちばんおすすめ</span>}
            {hasImg && <h3 className="font-bold text-[13.5px] leading-snug line-clamp-2"><Highlight text={plainTitle(post.title)} tokens={tokens} /></h3>}
            {tokens && tokens.length > 0 && <p className="text-[11.5px] text-sub leading-snug line-clamp-2"><Highlight text={post.content} tokens={tokens} /></p>}
            {onTag && (post.tags || []).length > 0 && (
              <div className="flex flex-wrap gap-x-2 gap-y-0.5">
                {post.tags.slice(0, 2).map(t => (
                  <button key={t} onClick={(e) => { e.stopPropagation(); onTag(t); }} className="text-[11.5px] font-bold text-brand-deep press">#{t}</button>
                ))}
              </div>
            )}
            <div className="flex items-center gap-1.5">
              {mine
                ? <span className="flex-1 min-w-0"><MineBadge type={post.type} /></span>
                : <><Avatar name={post.author} size={20} /><span className="text-[11px] text-mute truncate flex-1 min-w-0">{post.author}</span></>}
              <button onClick={onThanks} aria-label={isQ ? "気になる" : "助かった！"} className={cx("flex items-center gap-0.5 text-[12px] font-bold press", post.isLiked ? "text-love-ink" : "text-mute")}>
                <Icon n="favorite" fill={post.isLiked} size={16} className={post.isLiked ? "text-love" : ""} />{post.thanks}
              </button>
            </div>
            {isQ && (post.bestAnswerId ? <SolvedBadge /> : (
              <span className={cx("inline-flex items-center gap-1 text-[11px] font-bold", post.commentsCount ? "text-sub" : "text-brand-deep")}>
                <Icon n="forum" size={14} />{post.commentsCount ? `回答 ${post.commentsCount}` : "回答募集中"}
                {mine && post.commentsCount > 0 && <span className="text-love-ink ml-1">まだ選んでいません</span>}
              </span>
            ))}
            {!isQ && mine && post.commentsCount > 0 && (
              <span className="inline-flex items-center gap-1 text-[11px] font-bold text-sub"><Icon n="chat" size={14} />コメント {post.commentsCount}</span>
            )}
          </div>
        </article>
      );
    }

    // ホームの「回答を待っている質問」カード（横スクロール）
    function QuestionCard({ post, onOpen, unreadLabel, wide }) {
      const answerers = (post.comments || []).slice(0, 3);
      const mine = isMineName(post.author);
      return (
        <button onClick={onOpen} className={cx(wide ? "w-full" : "w-[248px] flex-shrink-0", "text-left bg-surface rounded-3xl border shadow-soft p-4 flex flex-col gap-2.5 press relative", mine ? "border-brand ring-2 ring-brand/20" : "border-line/70")}>
          <span className="flex items-center gap-1.5 text-[11px] text-mute">
            {mine ? <MineBadge type="question" /> : <><Icon n={catMeta(post.category).icon} fill size={14} className="text-brand-deep" />{catMeta(post.category).short}・{post.time}</>}
            {unreadLabel && <span className="ml-auto bg-brand text-on-brand text-[11px] font-black px-2 py-0.5 rounded-full flex items-center gap-0.5"><Icon n="notifications_active" fill size={12} />{unreadLabel}</span>}
          </span>
          {(post.joiners || []).length > 0 && (
            <span className="self-start inline-flex items-center gap-0.5 bg-brand-tint text-brand-deep text-[11px] font-black px-2 py-0.5 rounded-full"><Icon n="group" size={13} />同じ疑問 {post.joiners.length}人</span>
          )}
          <span className="flex gap-2">
            <span className="font-head font-black text-[22px] leading-none text-brand">Q.</span>
            <span className="font-head font-bold text-[15px] leading-snug line-clamp-3">{plainTitle(post.title)}</span>
          </span>
          <span className="mt-auto flex items-center justify-between gap-2 pt-1">
            {answerers.length > 0 ? (
              <span className="flex items-center gap-1.5 min-w-0">
                <span className="flex -space-x-2">{answerers.map(c => <span key={c.id} className="ring-2 ring-surface rounded-full"><Avatar name={c.user} size={22} /></span>)}</span>
                <span className="text-[11px] text-sub truncate">{post.commentsCount}人が回答</span>
              </span>
            ) : (
              <span></span>
            )}
            {mine
              ? <span className="flex-shrink-0 border border-brand text-brand-deep text-[12px] font-black px-3 py-1.5 rounded-full">{post.commentsCount ? "1つ選ぶ" : "確認する"}</span>
              : <span className="flex-shrink-0 bg-brand text-on-brand text-[12px] font-black px-3 py-1.5 rounded-full">答える</span>}
          </span>
        </button>
      );
    }

    // 📋 「回答を待っている質問」の一覧ページ（全画面。←で戻る）
    //   ・詳細はボトムシートで上に重ねる（ページは残るので、閉じると同じ位置に戻る）
    //   ・絞り込み：回答0件だけ／カテゴリ／自分の質問
    function WaitingPage({ questions, unreadLabelByPost, onOpen, onBack }) {
      useScrollLock();
      const [zeroOnly, setZeroOnly] = useState(false);
      const [mineOnly, setMineOnly] = useState(false);
      const [cat, setCat] = useState("");
      const list = questions.filter(p => (!zeroOnly || p.commentsCount === 0) && (!mineOnly || isMineName(p.author)) && (!cat || p.category === cat));
      const cats = CATEGORIES.filter(c => questions.some(p => p.category === c));
      const chip = (on) => cx("px-3 py-1.5 rounded-full text-[12.5px] font-bold whitespace-nowrap flex-shrink-0 flex items-center gap-1 press border", on ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line");
      return (
        <div className="fixed inset-0 z-[45] bg-bg flex flex-col animate-push-in" role="dialog" aria-label="回答を待っている質問">
          <div className="w-full max-w-md mx-auto flex-1 flex flex-col min-h-0">
            <header className="px-2 pb-2 flex items-center gap-1 border-b border-line/70 bg-bg" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
              <button onClick={onBack} aria-label="戻る" className="w-11 h-11 rounded-full flex items-center justify-center text-ink press"><Icon n="arrow_back_ios_new" size={22} /></button>
              <div className="min-w-0">
                <h2 className="font-head font-black text-[17px] leading-tight">回答を待っている質問</h2>
              </div>
            </header>
            <div className="px-4 pt-3 pb-2 space-y-2">
              <div className="flex gap-2 overflow-x-auto scrollbar-none">
                <button onClick={() => setZeroOnly(!zeroOnly)} aria-pressed={zeroOnly} className={chip(zeroOnly)}><Icon n="hourglass_empty" size={15} />回答0件だけ</button>
                <button onClick={() => setMineOnly(!mineOnly)} aria-pressed={mineOnly} className={chip(mineOnly)}><Icon n="person" size={15} />自分の質問</button>
              </div>
              <div className="flex gap-2 overflow-x-auto scrollbar-none">
                <button onClick={() => setCat("")} aria-pressed={cat === ""} className={chip(cat === "")}>すべて</button>
                {cats.map(c => (
                  <button key={c} onClick={() => setCat(cat === c ? "" : c)} aria-pressed={cat === c} className={chip(cat === c)}><Icon n={catMeta(c).icon} fill={cat === c} size={15} />{catMeta(c).short}</button>
                ))}
              </div>
            </div>
            <div className="flex-1 overflow-y-auto px-4 pt-1 space-y-3" style={{ paddingBottom: "max(1.5rem, env(safe-area-inset-bottom))" }}>
              <p className="text-[12px] text-sub px-1">{list.length}件</p>
              {list.length === 0 ? (
                <div className="text-center py-10 space-y-3">
                  <p className="text-[13px] text-mute">条件に合う質問はありません</p>
                  {(zeroOnly || mineOnly || cat) && <button onClick={() => { setZeroOnly(false); setMineOnly(false); setCat(""); }} className={cx(BTN_SOFT, "px-5")}>絞り込みを解除</button>}
                </div>
              ) : list.map(p => (
                <QuestionCard key={p.id} wide post={p} unreadLabel={unreadLabelByPost[p.id]} onOpen={() => onOpen(p)} />
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ≡ メニュー（全画面。右から開き、×で閉じる）
    const NOTIF_PREF_ITEMS = [
      { key: "answer", label: "自分の質問への回答", sub: "「いちばん助かった」の選択も含む" },
      { key: "thanks", label: "「助かった！」が付いたとき", sub: "自分の記事・回答" },
      { key: "comment", label: "自分の記事へのコメント" },
      { key: "watch", label: "「気になる」した質問の更新" },
      { key: "ai", label: "AIからのひとこと" },
      { key: "faculty", label: "自分の学部の新着まとめ", sub: `1日1回・${DIGEST_HOUR}時ごろにまとめて届きます` }
    ];
    const DOC_PAGES = {
      guide: { title: "ガイドライン", body: [
        ["お互いを思いやる", "同じ大学の仲間どうしの場です。やさしい言葉づかいを心がけましょう。"],
        ["個人を特定しない", "名前・顔写真・連絡先など、個人が特定できる情報は書かないでください。"],
        ["悪口・名指しの評価はNG", "特定の人や団体を傷つける投稿は削除の対象です。"],
        ["宣伝・勧誘はNG", "許可のない広告・勧誘・営業は投稿できません。"],
        ["体調のことは専門家へ", "回答は参考情報です。つらいときは医療機関や保健センターに相談してください。"],
        ["困ったら通報", "不適切な投稿・回答は「通報」から知らせてください。"]
      ] },
      faq: { title: "よくある質問", body: [
        ["ポイントはどうやって貯まる？", "記事の投稿で+10pt、質問への回答で+3pt、「助かった！」を押すと+1ptです。"],
        ["ポイントは何に使える？", "楽天ポイントに交換できます（仮）。「交換」タブから選んでください。"],
        ["名前は表示される？", "表示されるのは学部・学年だけです。投稿や回答は匿名にもできます。"],
        ["「いちばん助かった」とは？", "質問した人が、いちばん助かった回答を1つ選ぶしくみです。選ぶと質問は解決済みになります。"],
        ["ほかの大学の人は見られる？", "見られません。大学のメールアドレスで確認した学生だけが使えます。"]
      ] },
      terms: { title: "利用規約", body: [["準備中", "正式な利用規約は準備中です（デモ版）。"]] },
      privacy: { title: "プライバシーポリシー", body: [["準備中", "正式なプライバシーポリシーは準備中です（デモ版）。"]] }
    };
    function Toggle({ on, onChange, label }) {
      return (
        <button type="button" role="switch" aria-checked={on} aria-label={label} onClick={() => onChange(!on)}
          className={cx("w-12 h-7 rounded-full p-0.5 transition-colors flex-shrink-0", on ? "bg-brand" : "bg-line")}>
          <span className={cx("block w-6 h-6 rounded-full bg-white shadow-soft transition-transform", on ? "translate-x-5" : "")}></span>
        </button>
      );
    }
    function MenuRow({ icon, label, sub, onClick, href, danger, right }) {
      const inner = (
        <>
          <Icon n={icon} size={21} className={danger ? "text-danger" : "text-sub"} />
          <span className="flex-1 min-w-0">
            <span className={cx("block text-[14px] font-bold", danger ? "text-danger-ink" : "text-ink")}>{label}</span>
            {sub && <span className="block text-[11.5px] text-mute truncate">{sub}</span>}
          </span>
          {right || <Icon n={href ? "open_in_new" : "chevron_right"} size={18} className="text-mute" />}
        </>
      );
      const cls = "w-full text-left flex items-center gap-3 px-4 py-3.5 press";
      return href
        ? <a href={href} target="_blank" rel="noopener" className={cls}>{inner}</a>
        : <button type="button" onClick={onClick} className={cls}>{inner}</button>;
    }
    function MenuGroup({ title, children }) {
      return (
        <section className="space-y-1.5">
          {title && <h3 className="text-[12px] font-bold text-sub px-1">{title}</h3>}
          <div className="bg-surface rounded-3xl border border-line/70 shadow-soft divide-y divide-line/70 overflow-hidden">{children}</div>
        </section>
      );
    }
    function MenuPage({ me, plan, notifPrefs, setNotifPrefs, onClose, onPremium, onLogout, showToast }) {
      useScrollLock();
      const [sub, setSub] = useState(null);   // null | "notif" | "guide" | "faq" | "terms" | "privacy" | "contact"
      const [contactKind, setContactKind] = useState("サービスについて");
      const [contactBody, setContactBody] = useState("");
      const bodyRef = useRef(null);
      useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = 0; }, [sub]);
      const titles = { notif: "通知設定", contact: "お問い合わせ" };
      const title = sub ? (titles[sub] || DOC_PAGES[sub].title) : "メニュー";
      return (
        <div className="fixed inset-0 z-[45] bg-bg flex flex-col animate-push-in" role="dialog" aria-label={title}>
          <div className="w-full max-w-md mx-auto flex-1 flex flex-col min-h-0">
            <header className="px-2 pb-2 flex items-center gap-1 border-b border-line/70" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
              {sub
                ? <button onClick={() => setSub(null)} aria-label="メニューに戻る" className="w-11 h-11 rounded-full flex items-center justify-center press"><Icon n="arrow_back_ios_new" size={22} /></button>
                : <span className="w-11"></span>}
              <h2 className="flex-1 text-center font-head font-black text-[17px]">{title}</h2>
              <button onClick={onClose} aria-label="メニューを閉じる" className="w-11 h-11 rounded-full flex items-center justify-center press"><Icon n="close" size={24} /></button>
            </header>

            <div ref={bodyRef} className="flex-1 overflow-y-auto px-4 pt-4 space-y-5" style={{ paddingBottom: "max(2rem, env(safe-area-inset-bottom))" }}>
              {!sub && (<>
                {/* ログイン中の人＋プラン */}
                <div className="bg-surface rounded-3xl border border-line/70 shadow-soft p-4 space-y-3">
                  <div className="flex items-center gap-3">
                    <Avatar name={me.label} size={52} />
                    <div className="min-w-0 flex-1">
                      <p className="font-head font-black text-[16px] leading-tight">{me.faculty} {me.grade}年</p>
                      <p className="text-[12px] text-sub flex items-center gap-1"><Icon n="verified" fill size={14} className="text-brand-deep" />{me.univ}・大学メール認証済み</p>
                    </div>
                  </div>
                  <div className="flex items-center justify-between gap-2 bg-sunk rounded-2xl px-3.5 py-2.5">
                    <span className="text-[13px]">
                      <span className="text-sub">プラン：</span>
                      <b className={plan === "free" ? "text-ink" : "text-brand-deep"}>{plan === "free" ? "フリー" : "プレミアム（無料体験中）"}</b>
                    </span>
                    <button onClick={onPremium} className="text-[12px] font-black text-brand-deep flex items-center press">{plan === "free" ? "ほしい機能を投票" : "内容を見る"}<Icon n="chevron_right" size={16} /></button>
                  </div>
                </div>

                <MenuGroup title="設定">
                  <MenuRow icon="notifications" label="通知設定" onClick={() => setSub("notif")} />
                  <MenuRow icon="workspace_premium" label="プレミアム（準備中）" onClick={onPremium} />
                </MenuGroup>

                <MenuGroup title={`${me.univ}の公式情報`}>
                  {(me.sns || []).map(s => <MenuRow key={s.url} icon={s.icon} label={`公式 ${s.label}`} sub={s.handle} href={s.url} />)}
                  {me.website && <MenuRow icon="language" label="公式Webサイト" sub={me.website.replace(/^https?:\/\//, "").replace(/\/$/, "")} href={me.website} />}
                </MenuGroup>

                <MenuGroup title="サポート">
                  <MenuRow icon="help" label="よくある質問" onClick={() => setSub("faq")} />
                  <MenuRow icon="mail" label="お問い合わせ" onClick={() => setSub("contact")} />
                  <MenuRow icon="rule" label="ガイドライン" onClick={() => setSub("guide")} />
                </MenuGroup>

                <MenuGroup title="規約">
                  <MenuRow icon="description" label="利用規約" onClick={() => setSub("terms")} />
                  <MenuRow icon="shield_person" label="プライバシーポリシー" onClick={() => setSub("privacy")} />
                </MenuGroup>

                <MenuGroup>
                  <MenuRow icon="logout" label="ログアウト" danger right={<span></span>} onClick={onLogout} />
                </MenuGroup>
                <p className="text-center text-[11px] text-mute">TUNAGARI デモ版</p>
              </>)}

              {sub === "notif" && (
                <MenuGroup title="お知らせを受け取る">
                  {NOTIF_PREF_ITEMS.map(i => (
                    <div key={i.key} className="flex items-center gap-3 px-4 py-3.5">
                      <span className="flex-1 min-w-0">
                        <span className="block text-[14px] font-bold">{i.label}</span>
                        {i.sub && <span className="block text-[11.5px] text-mute">{i.sub}</span>}
                      </span>
                      <Toggle on={notifPrefs[i.key] !== false} label={i.label} onChange={(v) => setNotifPrefs({ ...notifPrefs, [i.key]: v })} />
                    </div>
                  ))}
                </MenuGroup>
              )}

              {DOC_PAGES[sub] && (
                <div className="space-y-3">
                  {DOC_PAGES[sub].body.map(([q, a]) => (
                    <div key={q} className="bg-surface rounded-3xl border border-line/70 p-4 space-y-1">
                      <p className="font-head font-black text-[15px]">{sub === "faq" ? `Q. ${q}` : q}</p>
                      <p className="text-[13.5px] text-sub leading-relaxed">{a}</p>
                    </div>
                  ))}
                </div>
              )}

              {sub === "contact" && (
                <div className="space-y-4">
                  <div>
                    <label className={LABEL} htmlFor="contact-kind">お問い合わせの種類</label>
                    <select id="contact-kind" value={contactKind} onChange={(e) => setContactKind(e.target.value)} className={cx(INPUT, "font-bold")}>
                      {["サービスについて", "不具合の報告", "ポイント・交換", "その他"].map(k => <option key={k}>{k}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className={LABEL} htmlFor="contact-body">内容</label>
                    <textarea id="contact-body" rows="6" value={contactBody} onChange={(e) => setContactBody(e.target.value)} placeholder="できるだけ具体的に書いてください" className={cx(INPUT, "leading-relaxed")} />
                  </div>
                  <button disabled={!contactBody.trim()} onClick={() => { showToast("お問い合わせを送信しました（デモ：実際には送信されません）"); setContactBody(""); setSub(null); }} className={cx(BTN_PRIMARY, "w-full")}>送信する</button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 🧭 自己分析レポート（キャンパスタイプ診断）
    //   ・投稿・回答・「助かった！」・活動ログから、端末内でタイプと強みを計算（デモ）
    //   ・本番では、同じ形（タイプ・強み・1年前→今・次の一歩）でAIに返してもらう想定
    // ============================================================
    const CAMPUS_TYPES = {

      help:    { name: "頼れるサポーター", icon: "volunteer_activism", strength: "サポート力", catch: "困っている人を見つけると、つい手を差しのべる。", tags: ["聞き上手", "やさしい", "経験値高め"],
                 before: "自分のことで手いっぱいだった", after: "経験を言葉にして、誰かの力になれるようになった" },
      curious: { name: "探究ラーナー", icon: "psychology_alt", strength: "探究心", catch: "「なんで？」を放っておかない。", tags: ["好奇心", "質問力", "コツコツ"],

    };
    function buildAnalysis(posts, logs) {
      const mine = (n) => typeof n === "string" && n.includes("あなた");
      const myPosts = posts.filter(p => mine(p.author));
      const infos = myPosts.filter(p => p.type !== "question");
      const questions = myPosts.filter(p => p.type === "question");
      const myComments = posts.flatMap(p => p.comments.filter(c => mine(c.user)).map(c => ({ ...c, isAnswer: p.type === "question", isBA: p.bestAnswerId === c.id })));
      const answers = myComments.filter(c => c.isAnswer);
      const thanksOnPosts = infos.reduce((a, p) => a + (p.thanks || 0), 0);
      const thanksOnAnswers = myComments.reduce((a, c) => a + (c.thanks || 0), 0);
      const logCat = (k) => logs.filter(l => (l.category || "").includes(k)).length;
      const raw = {
        share: infos.length * 10 + thanksOnPosts * 0.5,
        help: answers.length * 12 + thanksOnAnswers * 3 + answers.filter(c => c.isBA).length * 10,
        curious: questions.length * 10 + logCat("学習") * 8,
        plan: (logCat("履修") + logCat("学習")) * 12,
        explore: (logCat("キャンパス") + logCat("サークル")) * 14 + logs.filter(l => l.image).length * 4
      };
      const max = Math.max(1, ...Object.values(raw));
      const score = (k) => Math.round(45 + 50 * raw[k] / max);
      const order = Object.keys(raw).sort((a, b) => raw[b] - raw[a]);
      const evidence = {
        share: `記事${infos.length}件・「助かった！」${thanksOnPosts}回`,
        help: `回答${answers.length}件・「助かった！」${thanksOnAnswers}回`,
        curious: `質問${questions.length}件・学習ログ${logCat("学習")}件`,
        plan: `履修・学習の記録${logCat("履修") + logCat("学習")}件`,
        explore: `キャンパスの記録${logCat("キャンパス") + logCat("サークル")}件`
      };
      const typeKey = order[0];
      return {
        typeKey, type: CAMPUS_TYPES[typeKey],
        stats: [
          { label: "書いた記事", value: infos.length, unit: "件", icon: "edit_note" },
          { label: "答えた質問", value: answers.length, unit: "件", icon: "forum" },
          { label: "もらった「助かった！」", value: thanksOnPosts + thanksOnAnswers, unit: "回", icon: "favorite" },
          { label: "記録した活動", value: logs.length, unit: "件", icon: "menu_book" }
        ],
        strengths: order.slice(0, 3).map(k => ({ key: k, label: CAMPUS_TYPES[k].strength, score: score(k), evidence: evidence[k], icon: CAMPUS_TYPES[k].icon })),
        next: NEXT_STEPS[typeKey]
      };
    }
    function CountUp({ to, ms = 900 }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        let raf, t0;
        const step = (t) => { if (!t0) t0 = t; const r = Math.min(1, (t - t0) / ms); setV(Math.round(to * (1 - Math.pow(1 - r, 3)))); if (r < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [to]);
      return <>{v}</>;
    }

            <div className="flex items-center justify-between mt-3">

            </div>

            {loading || !data ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-5 text-center">

                <p className="font-head font-black text-[18px]">{LOAD_STEPS[stepText]}</p>

                <div key={i} className="flex-1 flex flex-col justify-center gap-6 relative pointer-events-none">

                    <div className="flex flex-col items-center gap-4 animate-reveal" style={{ animationDelay: "450ms" }}>
                      <span className="w-32 h-32 rounded-[2.2rem] bg-white text-brand-deep flex items-center justify-center shadow-lift animate-floaty rotate-[-4deg]"><Icon n={T.icon} fill size={72} /></span>

                    </div>

                  {i === 1 && (<>

                              <span className="block text-[11.5px] text-sub">{s.evidence}</span>
                            </span>
                          </div>
                          <div className="h-2 rounded-full bg-sunk mt-2.5 overflow-hidden"><div className="h-full rounded-full bg-brand animate-grow" style={{ width: `${s.score}%`, animationDelay: `${300 + k * 160}ms` }}></div></div>
                        </div>
                      ))}
                    </div>
                  </>)}

                  {i === 3 && (<>
                    <h2 className="font-head font-black text-[24px] text-center animate-reveal">1年前のあなた → 今のあなた</h2>
                    <div className="space-y-3">
                      <div className="rounded-3xl p-4 border border-white/40 animate-reveal" style={{ background: "rgb(255 255 255 / .12)", animationDelay: "150ms" }}>

    // ============================================================

      const loadSummary = () => {

      useEffect(() => { if (vote) loadSummary(); }, []);
      const submit = async () => {
        if (!sel.length) return;

      // 🤖 学生の回答が付かないまま時間が過ぎた質問には、AIが仮回答を付ける

        return () => timers.forEach(clearTimeout);
      }, [posts]);

      // 画面の色（自動＝端末の設定に合わせる／ライト／ダーク）
      const [theme, setTheme] = usePersistentState("theme", () => "auto");
      const [systemDark, setSystemDark] = useState(() => {
        try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
      });
      useEffect(() => {
        let mq;
        try { mq = window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) { return; }
        if (!mq) return;
        const on = (e) => setSystemDark(e.matches);
        if (mq.addEventListener) mq.addEventListener("change", on); else if (mq.addListener) mq.addListener(on);
        return () => { if (mq.removeEventListener) mq.removeEventListener("change", on); else if (mq.removeListener) mq.removeListener(on); };
      }, []);
      useEffect(() => {
        const root = document.documentElement;
        if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
        else root.removeAttribute("data-theme");
      }, [theme]);
      const isDark = theme === "dark" || (theme === "auto" && systemDark);

      const [isOcrProcessing, setIsOcrProcessing] = useState(false);
      const [ocrTags, setOcrTags] = useState([]);
      const [newTags, setNewTags] = useState([]);
      // 🔗 似ている質問に合流（「一緒に回答を待つ」）

      // 🔔 お知らせ（自分の質問への回答／「気になる」を押した質問の更新）
      const pushNotice = (post, kind, preview, mineOverride) => {
        const mine = mineOverride !== undefined ? mineOverride : isMineName(post.author);
        const prefKey = kind === "ai" ? "ai" : kind.startsWith("thanks") ? "thanks" : kind === "comment" ? "comment" : mine ? "answer" : "watch";
        if (notifPrefsRef.current && notifPrefsRef.current[prefKey] === false) return;   // 通知設定でオフ
        const n = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, postId: post.id, kind, mine, title: shortQuestionTitle(post.title), preview: preview || "", at: Date.now(), read: false };
        setNotices(prev => [n, ...prev].slice(0, 30));
        if (kind !== "ai" && kind !== "answer") { showToast(`🔔 ${noticeLabel(n)}`); return; }

      };
      // デモ：「気になる」を押した質問に、ほかの学生の回答が届いたことにする
      const deliverWatchedAnswer = (postId) => {

      };
      // 🎓 学部の新着まとめ：前回のまとめ以降に増えた「同じ学部の学生の投稿」（匿名・自分の投稿は除く）を、1日1回お知らせにまとめる
      //   ・本番：毎日 DIGEST_HOUR 時にサーバーから配信
      //   ・デモ：アプリを開いたとき、その日のまとめがまだなら作る（お知らせ画面のボタンで今すぐ届けることも可能）
      const [digestState, setDigestState] = usePersistentState("facultyDigest", () => ({ lastDay: "", ids: [] }));
      const digestRef = useRef(digestState);
      digestRef.current = digestState;
      const sendFacultyDigest = (force, extraPosts) => {
        const today = new Date().toDateString();
        const d = digestRef.current;
        if (!force && d.lastDay === today) return;
        if (notifPrefsRef.current && notifPrefsRef.current.faculty === false) { if (force) showToast("通知設定で「自分の学部の新着まとめ」がオフになっています"); return; }
        const pool = [...(extraPosts || []), ...postsRef.current];
        const fresh = pool.filter((p, i) => pool.findIndex(q => q.id === p.id) === i)
          .filter(p => facultyOf(p) === U.faculty && !isMineName(p.author) && !d.ids.includes(p.id));
        const next = { lastDay: today, ids: [...d.ids, ...fresh.map(p => p.id)] };
        digestRef.current = next;
        setDigestState(next);
        if (!fresh.length) { if (force) showToast(`${U.faculty}の新着はありません`); return; }
        const n = { id: `digest-${Date.now()}`, postId: null, kind: "digest", mine: true, faculty: U.faculty, count: fresh.length,
          title: "", preview: fresh.slice(0, 3).map(p => `・${plainTitle(p.title)}`).join("\n") + (fresh.length > 3 ? `\nほか${fresh.length - 3}件` : ""), at: Date.now(), read: false };
        setNotices(prev => [n, ...prev].slice(0, 30));
        showToast(`🔔 ${U.faculty}の新着まとめが届きました（${fresh.length}件）`);
      };
      useEffect(() => {
        if (!verified) return;
        const t = setTimeout(() => sendFacultyDigest(false), 2500);
        return () => clearTimeout(t);
      }, [verified]);
      // デモ：同じ学部の学生が投稿したことにして、今日のまとめをすぐ届ける
      const demoFacultyDigest = () => {

        };

      // 🧭 自己分析（デモ：端末内で計算。本番はAIに同じ形で返してもらう想定）
      const handleRunAiAnalysis = () => {

      const handleAnalysisAction = (a) => {
